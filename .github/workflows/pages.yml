name: Deploy documentation to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'scripts/install.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Copy installer
        run: cp scripts/install.sh site/public/install.sh

      - name: Install site dependencies
        run: cd site && bun install --frozen-lockfile

      - name: Install Chromium for Mermaid rendering
        run: cd site && bun x playwright install --with-deps chromium

      - name: Build site
        run: cd site && bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
