schema_version: maestro.recipe_profile.v1
id: maestro.standard-six-phase.v1
progress_tasks:
  - id: anchor-scope
    title: Anchor scope and authority
    phase: perceive
    required: true
    done_check: scope, authority, and hard stops are known
  - id: choose-next
    title: Choose next move
    phase: choose
    required: true
    done_check: next move is selected from recipe rules
  - id: execute-move
    title: Execute bounded move
    phase: act
    required: true
    done_check: bounded recipe action is complete or blocked
  - id: observe-evidence
    title: Observe evidence
    phase: observe
    required: true
    done_check: evidence, result, or blocker is recorded
  - id: record-learning
    title: Record reusable learning when needed
    phase: learn
    required: true
    done_check: durable learning is recorded or explicitly unnecessary
  - id: return-next-gate
    title: Return next gate
    phase: continue
    required: true
    done_check: next gate, next task, or hard stop is visible
invariant_ids:
  - standard-progress-structure
allowed_selectors:
  - maestro-read
  - maestro-write
  - local-read
  - local-write
  - git-read
forbidden_selectors: []
