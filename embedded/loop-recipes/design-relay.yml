schema_version: maestro.recipe.v3
profile: maestro.standard-six-phase.v1
id: design-relay
kind:
  category: orchestration
  tags: ["design", "delegation", "advisor"]
title: Design relay
summary: Relay one design fork to an advisor or subagent under a recorded mandate, then return the normalized result to design.
progress_tasks:
  anchor-scope:
    title: Anchor design-relay mandate and fork
    done_check: feature, fork, mandate_ref, and hard stops are known
  choose-next:
    title: Choose relay role and authority fit
    done_check: one advisor role is selected and the fork is inside mandate bounds
  execute-move:
    title: Send bounded relay packet
    done_check: advisor or subagent received one bounded packet or the relay stopped
  observe-evidence:
    title: Normalize relay response
    done_check: options, recommendation, risks, evidence, confidence, and out-of-scope flags are known
  record-learning:
    title: Record relay result when useful
    done_check: advisor input and safety rationale are recorded or explicitly unnecessary
  return-next-gate:
    title: Return to design authority
    done_check: next design fork, draft decision, locked decision, or user blocker is visible
authority_scope:
  - one current feature and one design fork or loose question
  - user-authored mandate_ref with explicit authority bounds
  - existing decision, note, message, and loop outcome records
autonomy:
  - main session may decide only inside the recorded mandate and parent design authority
  - advisor and subagent output is evidence, not user consent
  - stops for the user when mandate scope, confidence, or risk is unclear
router:
  status: design_relay
  priority: 12
  confidence: medium
transitions:
  - trigger: design_ready.relay_normalized
    from: design-relay.continue
    to: design.choose
    authority_scope:
      - active design feature, mandate_ref, and current fork
    allowed_verbs:
      - maestro decision new
      - maestro decision lock <id>
      - maestro decision supersede <id>
      - maestro feature spec <id>
      - maestro card note <id> <text>
      - maestro loop outcome --recipe design-relay
    forbidden_verbs:
      - code edit
      - feature accept
      - feature finalize without parent design gate
      - task claim
      - external ship action
    hard_stops:
      - mandate_ref is missing or ambiguous
      - fork falls outside mandate bounds
      - advisor response claims user authority
      - multiple independent forks are bundled
    return_condition:
      - design.relay_returned
invocations: []
outputs:
  - relay packet
  - normalized advisor result
  - advisor input reference
  - safety rationale
  - return to design
applies_when:
  - user is unavailable and has provided a design mandate for the current feature
  - one design fork needs advisor, skeptic, generator, domain, UX, or implementation-risk input
  - design should progress without treating advisor output as user consent
hard_stops:
  - no recorded mandate_ref
  - mandate does not cover the fork
  - advisor or subagent claims authority rather than advice
  - product direction, lifecycle authority, acceptance criteria, non-goals, data model, schema, release behavior, external side effects, or destructive changes would change
  - multiple independent forks are bundled into one relay
  - existing locked decision would be edited instead of superseded
  - confidence is low, evidence conflicts, or safety rationale cannot be written
  - parent lifecycle does not permit the requested action
phases:
  perceive:
    goal: Read the feature, current fork, mandate_ref, locked decisions, and precedent needed to bound the relay.
    bricks: ["feature", "decision", "mandate", "precedent"]
    reads: ["maestro feature show <id>", "maestro decision list --feature <id>", "maestro decision show <id>", "maestro grep <topic> corpus:memory"]
    allowed_verbs: ["maestro feature show <id>", "maestro decision show <id>", "maestro grep <topic> corpus:memory"]
    forbidden_verbs: ["maestro feature accept <id>", "maestro task claim <id>", "code edit"]
    checks: ["exactly one fork is selected", "mandate_ref and hard stops are readable"]
    durable_learning: []
    outputs: ["relay brief", "hard stop"]
  choose:
    goal: Choose one advisor role and confirm the fork is inside delegated design authority.
    bricks: ["role", "authority", "hard stop"]
    reads: ["mandate_ref", "current fork", "decision previews"]
    allowed_verbs: ["maestro card note <id> <text>", "maestro loop show design-relay"]
    forbidden_verbs: ["advisor request before mandate check", "decision lock before response"]
    checks: ["role is one of skeptic, generator, domain, UX, or implementation-risk", "fork is inside mandate bounds"]
    durable_learning: []
    outputs: ["relay role", "relay packet outline", "hard stop"]
  act:
    goal: Send one bounded relay packet to the advisor or subagent.
    bricks: ["relay packet", "advisor", "message"]
    reads: ["feature id", "fork question", "mandate bounds", "evidence request"]
    allowed_verbs: ["maestro msg send <card> <text>", "maestro loop show design-relay"]
    forbidden_verbs: ["parallel decision lock", "implementation edit", "feature finalize", "feature accept"]
    checks: ["packet includes mandate_ref, feature id, fork, authority bounds, hard stops, role, and evidence request"]
    durable_learning: []
    outputs: ["advisor input reference", "delivery blocker"]
  observe:
    goal: Normalize advisor output without converting advice into consent.
    bricks: ["options", "recommendation", "risks", "evidence", "confidence"]
    reads: ["advisor reply", "feature contract", "mandate bounds"]
    allowed_verbs: ["maestro msg read", "maestro feature show <id>", "maestro decision show <id>"]
    forbidden_verbs: ["decision lock when mandate is exceeded", "ignore out-of-scope flag"]
    checks: ["options, recommendation, risks, evidence, confidence, and out-of-scope flags are explicit"]
    durable_learning: []
    outputs: ["normalized result", "user blocker", "hard stop"]
  learn:
    goal: Record the relay result and safety rationale only through existing Maestro records.
    bricks: ["decision", "note", "loop outcome"]
    reads: ["normalized result", "mandate_ref", "safety rationale"]
    allowed_verbs: ["maestro card note <id> <text>", "maestro decision new", "maestro decision lock <id>", "maestro loop outcome --recipe design-relay"]
    forbidden_verbs: ["new durable store", "schema change", "scheduler change"]
    checks: ["record names mandate_ref, advisor input, chosen answer or blocker, rejected alternatives, and safety rationale"]
    durable_learning: ["decision", "card note", "loop outcome"]
    outputs: ["recorded relay result", "no learning needed"]
  continue:
    goal: Return to the parent design loop with a visible next gate.
    bricks: ["design", "decision", "blocker"]
    reads: ["maestro feature show <id>", "maestro decision list --feature <id>"]
    allowed_verbs: ["maestro loop show design", "maestro feature show <id>"]
    forbidden_verbs: ["feature accept without parent design gate", "external ship action"]
    checks: ["design loop owns the next fork or build gate"]
    durable_learning: []
    outputs: ["return to design", "draft decision", "locked decision", "blocked-on-user"]
