# Maestro's Herdr plugin (Hub d96). `maestro install` renders this file into
# the Hub room (~/maestro/herdr-plugin.toml, d833) with every "maestro" argv
# head replaced by the installed binary, then links the room over the socket;
# Herdr runs the hooks with the room as their working directory.
id = "maestro"
name = "Maestro"
version = "0.0.0"
min_herdr_version = "0.8.2"
description = "SLP team runtime: attention on Herdr events, restore after a Herdr restart, pane loss recorded when no runtime is up."
platforms = ["macos", "linux"]

[[startup]]
command = ["maestro", "slp", "restore"]

[[panes]]
id = "runtime"
title = "SLP runtime"
placement = "split"
command = ["maestro", "slp", "runtime"]

[[events]]
on = "pane.exited"
command = ["maestro", "slp", "event"]

[[events]]
on = "pane.closed"
command = ["maestro", "slp", "event"]
