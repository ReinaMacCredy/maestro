description: "Mandate ref: the user's exact APPROVE SUCCESSOR DESIGN PASS event in task 019f8416-e121-7703-8ab4-d3f9c3b374fa. Independent audit proved the repository has only a Stage-5 seal runner while Stage 12 requires final_full_chain_seal. The user-approved successor mandate requires one immutable Stage 0-12 snapshot, three independent engines, immutable historical Stage0/4/5 evidence, no separate interim Stage5 publication, one final receipt/pointer and semantic Stage-12 readback."
extra:
  locked_at: 2026-07-27T02:03:21.612Z
  decision: |-
    This additive Decision is the sole current execution-proof contract for final certification. It supersedes every prior design-only scheduling statement that labels Stage 5 separately certified or requires an interim Stage-5 seal, certification receipt, certification pointer or currentness publication. No interim Stage, including Stage 5, may publish a seal, certification receipt, certification pointer or currentness claim. Stage 5 may produce only one content-addressed frozen interface-and-fanout checkpoint after its required compile, lint, focused, architecture, authority and path-ownership falsifiers. That checkpoint is an input to the final seal, never a proof verdict, receipt or certification authority.

    After Stage 12 is integrated in strict first-parent order 6 through 12, the orchestrator freezes exactly one FinalCumulativeClosureSnapshotV1 before any engine executes. Its identity binds the final integration commit and tree; exact first-parent Stage 0-through-12 ancestry and every checkpoint/tree; every source, test, validator, fixture, mutation corpus, crash/race schedule, migration/rollback fixture, adapter matrix, removal/consumer/reader manifest, proof runner and engine byte; Cargo.lock and every dependency lock; interpreter, compiler, runtime, executable, target and dependency-output identities; command DAG and stable proof-ID ledger; expected outcome for every proof ID; Stage-to-proof ownership and required engine coverage; environment allowlist; sandbox profile; immutable input roots; disjoint writable/output roots; cache policy and final effect denylist. The snapshot excludes every execution output, engine result, receipt, pointer, verdict and final publication byte.

    The final-chain runner lives under one dedicated tools/vnext_contracts/final_chain implementation namespace and writes only to one dedicated contracts/vnext/final-chain proof namespace after execution. It materializes three separate read-only copies of the exact snapshot for independent Python, Rust and Ruby engines. Each engine has disjoint temp, target, dependency and output roots and independently parses the snapshot, expected ledger and canonical vectors; executes every proof obligation assigned to it; and emits one ephemeral complete engine ledger. No engine imports, executes, parses or trusts another engine's code, parser, oracle, result, cache, generated expected module or mutable filesystem output. The engines may consume the same immutable source snapshot and canonical vectors, but agreement alone is insufficient: every engine must independently match every frozen expected outcome and closure total.

    The stable proof ledger includes every Stage 0-through-12 behavior, positive and negative contract, mutant, owner/authority transition, race, crash/replay cut, idempotency branch, migration/rollback/restore case, adapter parity case, Resource/census/release identity, ancestry edge, consumer-zero/reader-zero/hold-zero check, legacy removal and canonical namespace promotion obligation. Every crash/race proof binds the exact fault schedule and proves each injection point was reached. Every migration proof binds original fixture hashes and exact old/new reader-writer cohort identities. Every adapter and removal proof runs after source-namespace promotion from a clean materialization without retained build output.

    Historical Stage-0, Stage-2, Stage-3, Stage-4 and Stage-5 receipts, artifacts and published pointers are immutable predecessor evidence only. Their exact bytes and ancestry may be bound as inputs, but no historical verdict, historical currentness flag or cached receipt satisfies any final proof ID. The final runner reexecutes the required semantics against the final snapshot. A changed source, executable test, validator, runner, proof input, lockfile, toolchain, environment, predecessor or expected-ledger byte changes the snapshot identity and invalidates every dependent result.

    Content-addressed caches may provide only immutable compilation or dependency-output bytes after exact equality of the complete bound source/tree, lockfile, toolchain executable and probes, engine implementation, target/profile/environment, command, dependency inputs/outputs and mutant identity. A cache may never provide a verdict, branch outcome, coverage claim, mutation result, race/crash result, semantic readback, ancestry claim, migration/rollback outcome or Stage-12 removal result. Missing, ambiguous, corrupt, substituted or mutable cache state refuses closed. Each engine retains isolated writable roots even when it reads identical immutable dependency bytes.

    Exactly one durable FinalCumulativeSealReceiptV1 exists. It binds the snapshot identity; all proof-ID coverage and expected outcomes; the three complete engine-ledger digests; independent receipt reconstruction; Stage-12 semantic readback; final edge sweep; ancestry closure; consumer/reader/hold zero closures; and the single pass/fail verdict. Per-engine ledgers remain ephemeral sandbox outputs or digest-bearing embedded members of this one receipt; they are not separately published receipts. Exactly one final pointer may be derived and written only after the receipt is reconstructed from immutable outputs and Stage-12 semantic readback succeeds. No shared verdict file, summary-only aggregator, partial seal or three-pointer set is current.

    Stage-12 readback is semantic and executes from a clean final-tree materialization. It proves that no production module/export/re-export, CLI/MCP/TUI/hook/shell/Skill route, generated Resource, persisted schema identifier, migration route, adapter, retained binary or reader resolves through the temporary vNext namespace or legacy compatibility path; canonical owner facades compile and execute representative equivalent behavior; persisted schema, wire, Resource, Manifest, Receipt and migration identities remain byte-identical across the source-only promotion; and consumer-zero, reader-zero and hold-zero are computed against actually produced artifacts. Negative fixtures reintroducing the temporary namespace, legacy adapter, old reader, stale pointer or removed Resource must fail the seal.

    The final seal is effect-inert. It may not install, publish, activate, release, push, tag, contact a remote connector, mutate live external systems, touch the protected primary checkout or write outside packet-bound proof roots. Receipt-bound readback and the final edge sweep occur only after all source, test, validator, artifact and runner bytes are frozen. If any final check requires changing those bytes, the candidate unfreezes, the smallest owning Stage is corrected and reintegrated in order, a new snapshot identity is minted, and exactly one replacement full-chain run may begin. No post-seal source or proof edit is permitted.

    This Decision adds no Maestro product Action, owner, schema, Resource, Bundle, Release, public API, wire representation or runtime authority. FinalCumulativeClosureSnapshotV1 and FinalCumulativeSealReceiptV1 are external proof-control artifacts only and cannot become a Contract Root, canonical Build Handoff, Mandate, Grant, Action, Result or runtime Receipt.
  preview: |-
    final first-parent Stage 0..12 tree
      -> one immutable FinalCumulativeClosureSnapshotV1
      -> isolated Python engine
      -> isolated Rust engine
      -> isolated Ruby engine
      -> exact proof-ID coverage + expected outcomes
      -> semantic Stage-12 readback + edge sweep
      -> one FinalCumulativeSealReceiptV1
      -> one final pointer
  rejected:
  - |-
    Retain a separately certified Stage-5 seal and later call another result cumulative: two certification authorities and two currentness epochs would exist.
  - |-
    Use one shared test root with three language wrappers or a shared parser/oracle: filesystem, cache and interpretation coupling would defeat independence.
  - |-
    Publish three engine receipts plus an aggregator receipt: the final state would become a composite pointer set rather than one exact receipt.
  - |-
    Reuse historical Stage receipts or cached verdicts as final proof nodes: predecessor evidence is not final-tree reexecution.
  - |-
    Use source grep or textual absence alone for Stage-12 promotion/removal: compiled, generated, persisted, migration and retained-reader surfaces can survive.
  - |-
    Permit verdict, mutation, crash/race, semantic-readback or removal-result cache reuse: proof truth is not a reusable build artifact.
