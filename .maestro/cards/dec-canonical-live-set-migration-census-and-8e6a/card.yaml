id: dec-canonical-live-set-migration-census-and-8e6a
type: decision
title: Canonical live-set Migration census and quarantine epoch
status: superseded
parent: maestro-whole-flow-architecture-refoundation
created_at: 2026-07-27T14:32:37.947Z
updated_at: 2026-07-28T10:16:03.000Z
description: The V5 fixed-349 contract binds historical open-world matcher sightings as current byte-total authority. Live clean successor 1f65f98b deterministically observes 385 sightings across 70 files, so the old currentness claim is false and cannot be repaired without a versioned internal proof-semantics successor.
extra:
  locked_at: 2026-07-27T14:32:37.992Z
  decision: 'Rotate the unimplemented LegacyQuarantineEpochV2 contract to LegacyQuarantineEpochV3. The historical 349 sightings across 68 files, 14 provisional relations and 10 provisional overlaps become HistoricalLegacyObservationV1 comparison provenance only; they are never a current count, physical inventory cardinality, completeness invariant, removal prerequisite or currentness claim. Foundation alone derives and retains admitted physical scope, descriptors and a one-use source-copy continuation. Migration receives opaque source cases and owns only their classifications, dispositions, present-byte quarantine records, unavailable-preexisting-loss records, declared overlap semantics, rollback assessment and epoch identity. MembershipKeyV3 binds owner domain, owner-minted root binding, lossless display locator, resolved locator commitment, object identity, node kind and metadata commitment. SourceCaseV3 additionally binds the Foundation census invocation, payload-state tag, exact length and digest. Stage12SightingV2 binds one SourceCaseV3, rotated policy identity, rule, matcher, matched bytes and byte offset; multiple sightings never multiply preserved bytes. Every present source is copied from a retained descriptor and rechecked for bytes, length, digest, metadata, object and descriptor facts. Every truly unavailable source requires independently issued historical length, digest, metadata, provenance and loss-evidence identity; placeholders and Git existence alone never suffice. Protected-primary memberships remain distinct read-only cases and only exact owner-declared overlap pairs are admitted. Finalization atomically rejoins owner admissions, Foundation root set and invocation, Release, Store Generation and head, namespace epoch, Trust Root, provider, mount, anchor, fence, classification policy, candidate commit and tree, protected-primary boundary, rollback plan, currentness and revocation. Drift yields no epoch and no removal authority; retry creates a new immutable epoch. Stage 12 remains a read-only sighting observer: the pre-cut count is diagnostic and may change only through a fresh deterministic manifest, while final success still requires zero current legacy sightings, consumers, readers and holds. No source tree, protected primary, installation, publication, Release or live external root is mutated by this Decision or its design proof.'
  superseded_by: dec-canonical-owner-issued-loss-evidence-0e5b
  supersedes:
  - dec-canonical-byte-total-legacy-quarantine-33c9
  preview: Foundation retained live-set census -> Migration SourceCaseV3 classifications -> exact present bytes or independent loss evidence -> LegacyQuarantineEpochV3 -> final owner/currentness recheck; historical 349 remains comparison only
  rejected:
  - 'Keep 349 as a golden count: confuses historical literal sightings with live physical truth.'
  - 'Remove count equality but accept arbitrary rows: loses owner-derived case completeness and per-case disposition.'
  - 'Treat missing primary bytes, Git objects or zero placeholders as loss proof: violates stop-before-loss.'
