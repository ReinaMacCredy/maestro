  - dec-canonical-manifest-bound-one-use-legacy-d5db
  preview: complete V4 loss/root/rollback/epoch closure -> Authority LegacyRemovalGuardV3 for product-only pruning; separately packet-bound coordinator V3 -> one isolated candidate-ref CAS -> effect-inert cumulative seal
  rejected:
  - 'Let the V2 guard accept V4 digests: that creates silent typed polymorphism and replay across incompatible epochs.'
  - 'Keep the V2 coordinator and compare aggregate identities: it cannot prove the new protected-history and owner-universe joins.'
  - 'Let the final seal runner perform pruning: proof execution remains effect-inert and owns no mutation authority.'
