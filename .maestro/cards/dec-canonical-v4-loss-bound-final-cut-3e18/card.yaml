description: The current locked removal Decision is typed to UnavailablePreexistingLossManifestV3,
  LegacyQuarantineEpochV3, LegacyRemovalGuardV2 and Stage12LegacyCutCoordinatorV2.
  The authenticated V4 loss closure cannot be consumed safely without an explicit
  typed successor; identity-only wording would leave two incompatible current heads.
extra:
  locked_at: '2026-07-28T10:29:14.000Z'
  decision: |-
    Supersede dec-canonical-manifest-bound-one-use-legacy-d5db only where its removal and isolated-cut types bind the superseded V3 loss/epoch family. Preserve every unaffected private minting, one-use, no-target, exact-deletion-plan, rollback, consumer-reader-hold-zero, namespace-promotion, effect-inert proof, expected-preimage CAS, crash-resolution, primary-protection and one-final-seal law.

    Authority owns LegacyRemovalGuardV3 with the same private non-static cut lifetime and process-local, private-field, move-only, one-use, non-Clone, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync, non-wire, non-Resource, non-Action and non-ScopeAtom capability law. Authority mints it only inside the named pruning admission after validating complete owner-issued facts and atomically rechecking Authority snapshot, epoch, Trust Root, fence, state token, currentness and revocation. It binds realm, Release, Store Generation and head, unique invocation, LegacySourceCaseManifestV3, Stage12SightingManifestV2, MigrationClassificationManifestV3, DeclaredOverlapManifestV2, UnavailablePreexistingLossManifestV4, SealedQuarantineManifestV3, FoundationLegacyQuarantineClosureV2, LegacyRollbackAssessmentV4, LegacyQuarantineEpochV4, replacement activation, consumer-reader-hold closure, rollback rehearsal and exact deletion-plan commitment. No V2 guard, V3 loss/epoch value, scalar digest, caller-built manifest or adapter can produce V3 authority.

    Installation consumes the guard only in its exact product physical-pruning continuation after final owner and Persistence expected-old rechecks. Operations coordinates and cannot mint, inspect, convert or replay it. Product pruning remains implemented and parity-proved but is never executed against a live installation in this build.

    ExternalProofControl owns Stage12LegacyCutCoordinatorV3 for isolated repository source pruning under the exact approved V8 packet. It retains the protected-primary descriptor, source Git binding, clean 1685b391 preimage commit and 2daa5f84 tree, V4 loss/rollback/epoch and Foundation closure, sealed quarantine, replacement activation and adapter parity, exact consumer-reader-hold-zero manifests, rollback rehearsal, exact 210-entry namespace promotion map, Release and proof-registry currentness and declared post-cut tree in fixed order. Its sole write authority remains one expected-preimage compare-and-swap from the isolated successor candidate ref to the declared post-cut commit and tree. Primary is never a target. Crash resolution recognizes only the exact preimage or postimage. The coordinator cannot reconstruct or substitute an Authority guard, and the cumulative proof runner remains effect-inert.

    Any source-case, sighting, classification, overlap, V4 loss, quarantine, owner-universe, Foundation closure, activation, consumer, reader, hold, rollback, namespace, Release, Store, protected-journal, Git, primary-boundary, currentness or revocation drift refuses before candidate-ref CAS. Stage 12 freezes exactly one final Stage 0 through 12 closure for one independent Python, Rust and Ruby cumulative seal, one final receipt and one derived pointer. This Decision changes no public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member.
  superseded_by: dec-canonical-v4-loss-authority-naming-2e14
