description: 'Mandate ref: the user-role next event in task 019f8416-e121-7703-8ab4-d3f9c3b374fa authorizes the successor legacy-cutover design pass only. Current read-only Stage-12 evidence at implementation checkpoint 5cbd7b8a observes 349 blocking rows across 68 files, with provisional closure evidence identifying 14 absent or stale exact-byte cases and 10 protected-primary overlaps. Fresh adversarial review selected a strengthened Migration semantic epoch while preserving Foundation physical-scope ownership. No implementation, canonical regeneration, pruning, seal, publication or primary mutation is authorized by this Decision.'
extra:
  locked_at: 2026-07-27T10:15:26.726Z
  decision: |-
    Migration owns one non-promoting LegacyQuarantineEpochV2 semantic record, but Foundation alone owns admitted physical scope, descriptor-relative no-follow reads, aggregate census, retained fences and bounded source-copy access. The epoch canonical-CBOR identity binds the complete Foundation-issued admitted-root-set identity, two-pass aggregate census identity, canonical ordered live inventory, classification set, per-row disposition and reason, sealed quarantine manifest, exact metadata objects, Release identity, Store Generation and head identity, rollback assessment and plan, protected-primary boundary identity and final currentness tuple. Migration receives only opaque source association tokens and bytes or metadata through a consumed Foundation continuation; it cannot supply, widen, re-resolve, enumerate or reopen a root, path, count, absence claim, locator, backend or reader.

    Every present row is copied from its retained descriptor into ordered canonical-CBOR chunks binding epoch ID, source ID, ordinal, exact bytes, length, content digest and canonical metadata facts. Reconstructed bytes and metadata must equal both the original census row and the final post-copy descriptor recheck. An unavailable source is never represented by fabricated or zero bytes. Each unavailable-preexisting-loss row must instead bind the exact historical expected length, digest and metadata commitment plus an independently proved loss-evidence identity; missing loss evidence refuses the entire epoch. Fresh generation must account exactly for every observed 349 row and 68 file and must name every provisional 14 gap and 10 protected-primary overlap; any count or membership drift reopens the design boundary rather than silently changing the manifest.

    Protected-primary overlaps remain read-only distinct locator memberships and confer no ownership, mutation, deletion, relinking or deduplication authority. A physical alias is admitted only as an exact declared overlap pair proven by both owner sources; every undeclared alias refuses. Quarantine chunks, metadata objects, manifest, journal and receipt reside in one custodied root disjoint by canonical locator, descriptor identity and mount from every display or resolved active discovery root and from the protected primary. The root is non-active and cannot be enumerated by normal discovery, runtime, compatibility, Release or installation readers. Recovery requires a separately authorized identity-bound offline export and can never become an automatic fallback.

    Finalization performs the post-copy descriptor recheck and one expected-old join over Release, Store Generation and currentness. Any missing, extra, duplicate, altered, relinked, remounted, replaced or reclassified source; content or metadata drift; ABA; namespace, path-chain, device, mount, provider, anchor or fence drift; changed active-root set; changed protected-primary boundary; revocation; overflow; or partial copy produces zero epoch authority and zero removal authority. Historical Git objects, E204/C325 ledgers and predecessor receipts are evidence only. The epoch remains audit and rollback material, never an active consumer, runtime reader or proof of consumer zero.
  superseded_by: dec-canonical-live-set-migration-census-and-8e6a
  preview: |-
    Persistence + Installation owner admissions
      -> Foundation retained-descriptor aggregate census and bounded copies
      -> Migration classifications over opaque source tokens
      -> LegacyQuarantineEpochV2 exact chunks + metadata + loss evidence
      -> final descriptor and Release/Store/currentness CAS
      -> sealed non-active rollback material or whole-epoch refusal
  rejected:
  - 'Reuse SealedQuarantineManifestV1 alone: it lacks Release, Store Generation, rollback, final currentness, live copy fencing and unavailable-source evidence.'
  - 'Create an archive or export side channel owned by Migration: it would duplicate Foundation physical-root authority and could become a hidden reader.'
  - 'Treat historical Git or E204/C325 hashes as the current byte closure: they omit live drift and cannot preserve protected primary bytes.'
