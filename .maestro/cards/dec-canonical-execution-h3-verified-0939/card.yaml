extra:
  locked_at: 2026-07-23T17:54:19.014Z
  decision: |-
    This additive materialization Decision incorporates without supersession every unaffected law of effective dec-close-lifecycle-to-action-totality-and-efa0, its incorporated dec-canonical-effect-intent-local-3905 withdrawal closure, and dec-canonical-typed-migration-cutover-65b3. It changes no Action, Ceremony, Effect Origin, owner, authority meaning, catalog, Resource, public schema, persistent schema or wire representation.

    Execution owns and mints VerifiedH3WithdrawalPublicationUseV1 only after the exact native-cancelled H3 withdrawal publication is durably established under the existing withdrawal law. The type is private to its sealed production port and available to Migration only as a pub(crate) move-consuming use; each process-local instance is linear and single-use. Its durable uniqueness does not come from token identity. Uniqueness remains the existing 65b3 normalized association uniqueness, single-consumption finality join and idempotency law. Concurrent reconstructions from the same durable withdrawal may exist, but exactly one matching finality wins; the same key with byte- and semantic-identical complete meaning returns the exact committed Result, changed meaning conflicts, and a new key performs a fresh evaluation.

    The verified source is one exact closed sum. ActiveStore binds the exact source Store and domain, current snapshot, predecessor and cancelled Head revisions, writer term, winning expected-old transition, same-Store withdrawal publication and root, plus the existing 65b3 ActiveStore association and finality context. ActiveStore is the only same-domain branch. PreStore binds the exact PreStore Home, protected Realm, subject and source candidate carrier, CeremonySpec and Attempt, expected-old protected source value, and the winning source-withdrawal protected carrier, CAS and source withdrawal publication root only. It does not bind the destination 65b3 association, candidate seal, current Head, destination protected CAS or any containing or future root. Migration first creates the association from the verified source and then the destination owner performs its own finality. NoStore binds the exact NoStore Home, CeremonySpec and Attempt, and external or protected occurrence and carrier without fabricating DomainId, Generation or Epoch; it contributes only non-promoting history unless the separately locked PreStore finality prerequisites are later established. PreStore continuity is protected by the exact Realm and Ceremony lineage rather than a fabricated active Store identity.

    The originating branch is the exact tagged sum Action { leaf, ActionSpec, request, route } or Ceremony { CeremonySpec, Attempt, Withdraw mode, route }. The value binds Intent identity, revision, origin and Home; the originating Operation Result and the distinct withdrawal-publication Result; withdrawal request; Authority basis, snapshot, fence, state token, currentness, revocation and trusted time; the complete normalized Authority witness, DebitMapV1 and committed withdrawal debit; Authorization Receipt; occurrence, carrier and incarnation; no-live Attempt, fence, seal or Release facts; closed Runs; effect-slot and dispatch-budget accounting; and material, credential and use-fence currentness.

    The value also binds the exact existing 65b3 MigrationCutoverAssociationV1 meaning without persisting itself: source inventory identity and row commitment; declared target closure and cancelled target; display and resolved identity commitments; authorizing tagged Operation or Ceremony; effect lineage; custody and transition; quarantine and protected roots; consumer gate; Receipt, claims, catalog and verification commitments; optional Release; Result and idempotency meaning. Execution validates all source and Authority facts. Migration may consume only the exact bound H3 source, target and context and must separately validate its own association, finality and destination facts. No cross-Store currentness or transaction is created.

    The carrier binds no self hash, future association hash or containing-root hash. Its identity is never persisted. The exact source, target and context bound by the carrier are earlier inputs to the existing association identity. This Decision does not claim any new named candidate-only persisted type or field. If the frozen 65b3 fields cannot carry the exact binding without reinterpretation, Design must reopen; no schema delta is authorized.

    VerifiedH3WithdrawalPublicationUseV1 has private fields and Execution-private constructors. It has no public constructor, Copy, Clone, Default, serialization, canonical bytes, persistence, cache, registry, log form, wire form, Resource identity, conversion or independently replayable durable bearer path. Production raw snapshot, digest and constructor adapters are removed. Test-only fixtures implement only sealed conformance ports.

    A losing Migration finality attempt performs no additional Migration write and consumes no association finality. It neither refunds nor repeats an already committed withdrawal debit. ActiveStore retains its one same-Store finality transaction; PreStore retains protected expected-old CAS, recovery_required and in_doubt handling; NoStore remains non-promoting.

    Proof covers all three Homes and both tagged origin branches; wrong Intent, revision, Home, subject, Store, Realm, Ceremony, Attempt, request, route, Result, withdrawal publication, occurrence, carrier, authority, DebitMap, debit, no-live fact, Run closure, slot or material fact; Action/Ceremony tag substitution; same-domain use outside ActiveStore; fabricated NoStore identity; PreStore destination or future-root binding; missing, duplicate and contradictory H3 candidates; cancel-like labels without causal withdrawal; raw constructor, digest, persistence, replay, Send, Sync, escape and drop; concurrent reconstructions; exact one-winner finality; same-key replay and changed-meaning conflict; crash and uncertainty recovery; no withdrawal refund or repeat; no production raw adapter; and unchanged public and persisted schema, catalog and Resource closure.
  preview: |-
    durable native-cancelled H3 withdrawal publication
      -> Execution validates exact Home, origin, authority and occurrence
      -> process-local VerifiedH3WithdrawalPublicationUseV1
      -> Migration binds the existing 65b3 association meaning
      -> one context-correct finality winner or no additional Migration write
  rejected:
  - 'Expose a public, serializable or restart-surviving bearer Receipt: possession could substitute for fresh owner validation and permit replay.'
  - 'Create a spent-token ledger, cache or durable token registry: uniqueness belongs to the existing association and finality transaction.'
  - 'Allow Migration to mint from a raw snapshot, digest, label or caller-asserted cancellation: Migration does not own withdrawal truth.'
  - 'Require one globally non-remintable process token: crash recovery may reconstruct from the same durable withdrawal while durable finality remains singular.'
  - 'Treat the token as authority, currentness, installed state or finality: it is only a verified-use carrier for one existing causal prerequisite.'
  - 'Create a cross-Store transaction or cross-Store currentness claim: each context retains its locked finality owner and boundary.'
  - 'Use an untagged Action-or-Ceremony branch: equal fields could substitute across distinct provenance and admission laws.'
  - 'Bind the association itself, a self hash, containing root or future hash into the carrier: the dependency would be circular or authorize future material.'
  - 'Refund or repeat the committed withdrawal spend when Migration loses: withdrawal finality and Migration finality are distinct durable facts.'
  - 'Add a new persisted or public field, schema, catalog member or Resource identity: this Decision authorizes internal materialization only.'
