schema_version: maestro.card.v1
id: dec-canonical-non-action-protected-90a9
type: decision
title: Canonical non-Action protected continuity diagnostic guard
status: locked
parent: maestro-whole-flow-architecture-refoundation
created_at: 2026-07-21T19:19:08.123Z
updated_at: 2026-07-21T19:19:08.289Z
description: The predecessor phrase dedicated current diagnostic authority was ambiguous and led to an invalid proposed ReadRepository ScopeAtom outside the frozen Action catalog. The design already requires an exact Action or pure-read classification and permits protected inspectors. This successor closes the ambiguity without changing frozen public semantics.
extra:
  locked_at: 2026-07-21T19:19:08.289Z
  decision: Classify protected continuity inspection as one pure-read authorization guard, not an Action. Authority derives ProtectedContinuityDiagnosticReadGuardV1 only inside one serialized current Store read from the exact current authenticated human operator facts, exact current Authority snapshot and guard, exact active Store generation, exact requested protected subject, and a subject-bound LinearizationCoverageWitnessV1 whose carrier is ProtectedSnapshot. It binds principal, Binding, Session, Context, Trust Root revision, Generation, Epoch, authentication carrier, revocation state, trusted time, currentness, and the exact snapshot carrier, revision, state token, fence, and Authority snapshot identity; any mismatch, staleness, expiry, revocation, substitution, unavailable time, or intervening currentness change refuses with bounded non-oracular output. The guard is lifetime-bound, non-serializable, non-cloneable, non-cacheable, non-transferable, non-bearer, and valid only to construct the locked protected diagnostic envelope from that unchanged view. It creates no ScopeAtom, ActionSpec, Ceremony, Grant permission, Mandate, capacity debit, Receipt, Result, idempotency mapping, Observation, or persistent authority; performs zero writes, persistence, I/O, mutation, currentness or generation selection, occurrence establishment, repair, retry, activation, or extra disclosure; and changes no ordinary result, sealed-audit custody, public or wire schema, Resource, Bundle, Release, MCP Tool, or Action catalog.
  supersedes:
  - dec-protected-continuity-diagnostics-2f11
  preview: ordinary bounded result < exact current invocation-local pure-read guard < allowlisted protected envelope < sealed non-bearer audit
  rejected:
  - 'Add an InspectProtectedContinuity Action or ScopeAtom: contradicts the frozen 145-row ActionSpec and ScopeAtom law.'
  - 'Reuse an unrelated Action, Grant, Mandate, Receipt, Gate pass, or audit record: turns evidence or bearer material into authority and enables replay.'
  - 'Trust adapter-supplied operator or snapshot facts: creates a topology oracle and substitution path.'
  - 'Permit caching, persistence, repair, retry, selection, or mutation: creates a second lifecycle and authority channel.'
