description: "Mandate ref: the user's exact APPROVE SUCCESSOR DESIGN PASS event in task 019f8416-e121-7703-8ab4-d3f9c3b374fa. Independent audit proved the frozen ProtectedLocatorOperationRequestV1 requires candidate carrier and association before acquisition, while ca82 requires acquisition before those values exist; the generic finality callback also permits false CAS or readback. This successor replaces the contradictory V1 Stage-5 realization while preserving the owner laws and outcome semantics of ca82 and f439."
extra:
  locked_at: 2026-07-27T02:02:30.695Z
  decision: |-
    This Decision supersedes dec-canonical-persistence-owned-protected-ca82 and dec-canonical-installation-owned-durable-f439 as the effective production contract. It incorporates their unaffected ownership, one-use capability, no-caller-evidence, final currentness, ActiveStore atomicity, PreStore inertness, idempotency, crash/recovery and typed-outcome laws. ProtectedLocatorOperationRequestV1, ProtectedLocatorLeaseV1 and the production generic provider/callback realization are immutable historical predecessor evidence only and are not a compatibility path.

    Installation constructs one owner-private ProtectedLocatorAcquisitionRequestV2 before association, candidate root, candidate carrier, candidate seal, expected-old CAS, publication value or finality backend exists. It contains exactly the nominal InstallationId, Realm, InstallationDomain, requested operation, CeremonySpec, Attempt, exact target identity, authenticated host/provider branch identity, unique invocation, owner-derived admission identity, current authority carrier commitment and revocation subject. It contains no protected root, filesystem path, locator-derived source or candidate carrier, association, candidate root or seal, expected-old CAS, raw locator token, publication value, count, absence claim, digest, parsed provider state, callback or backend selector.

    Persistence alone uses that request to acquire the real protected locator through a no-follow owner port and mints ProtectedLocatorLeaseV2<'locator> before inert association materialization and every candidate derivation. The lease retains the exact backend handle and external anchor; facility and provider identity/incarnation; Realm, InstallationDomain and locator slot; live observed root and expected-old CAS; target, Ceremony, Attempt and invocation; Store or pre-store incarnation; currentness, anti-rollback, state-token, fence and revocation facts; and the same-locator reread/CAS-resolution capability. The expected-old value is never projected as a raw scalar and no caller or candidate can supply it.

    Only Installation's owner continuation may move the live lease through PreStore consumer-closure validation, inert association materialization, candidate-root and carrier derivation, seal construction and finality preparation. After association exists, the owner derives one private ProtectedLocatorCandidateTransitionV2<'locator> that borrows the retained lease and binds the exact association, old observation, candidate root/carrier/seal, Ceremony, Attempt and postcondition. It has no public constructor, raw-CAS accessor, serialization, cache, callback conversion or generic provider escape.

    The existing Ceremony owner alone consumes the candidate transition to dispatch exactly one protected expected-old CAS. PreStore finality itself remains strictly inert: it performs no Store, network, locator, CAS or currentness mutation; it validates the complete association/consumer/candidate/seal/postcondition closure and joins the live lease before Ceremony dispatch. The lease survives through acquisition, all inert derivation and validation, the Ceremony-owned CAS, and exact same-locator final resolution. It does not turn PreStore into an atomic Store writer.

    Same-locator resolution returns exactly: committed when the exact candidate root and carrier with valid seal are current; recovery_required when the exact old root remains with carrier-native proof of definite non-occurrence and no late apply; in_doubt when occurrence cannot be proven; or integrity_blocked for a third value, wrong Realm/Attempt/carrier, invalid seal, provider substitution or contradictory state. Unknown occurrence is reconciled only under the same Ceremony and Attempt with fresh branch authority; it is never asserted absent, blindly redispatched or inferred successful from acknowledgement.

    ActiveStore finality is separate. Installation's named capture_owner_publication_v2 operation captures a concrete current StoreV1 provider and owner transaction view inside DurableInstallationFinalityBackendV2::ActiveStore. It atomically writes the exact Receipt, claim, catalog, Migration association, owning-domain current-head join, Result and idempotency rows, then performs owner-local postcondition readback against that Store/head/generation. No production constructor accepts a generic callback, trait object supplied by a caller, ambient Store lookup, registry or mock provider. Generic bindings remain test-only conformance machinery and cannot compile into production acquisition paths. DurableInstallationFinalityBackendV2::PreStore captures only the inert validation continuation and live locator transition; it owns no Store or protected CAS.

    ProtectedLocatorLeaseV2, ProtectedLocatorCandidateTransitionV2 and DurableInstallationFinalityBackendV2 are owner-minted, process-local, move-only, non-cloneable, non-serializable, non-cacheable, non-replayable, non-Send, non-Sync and non-transferable, with private fields, private constructors and non-static lifetimes. They have no public or crate-wide constructor, Copy, Clone, Default, Debug, raw scalar accessor, downcast, canonical bytes, persisted form, wire form, Resource identity, registry, restart reconstruction or hidden global lookup. Same-key committed Result replay is checked before acquisition, returns the stored Result and performs no lease mint, I/O, authority spend or new write.

    Stage 5 freezes ProtectedLocatorAcquisitionRequestV2, the Persistence acquisition port, ProtectedLocatorLeaseV2, the Installation derivation continuation, ProtectedLocatorCandidateTransitionV2 and DurableInstallationFinalityBackendV2. Stage 9 implements the real protected-locator and ActiveStore providers and executable positive paths; Stage 11 consumes the PreStore continuation only through this frozen owner operation. The V1 request/hash and generic provider path are retired from production and retained solely as negative and historical proof inputs. No public schema, Action, owner tag, catalog member, Resource, wire representation or persisted data shape changes.

    Proof executes a real protected-locator positive path that acquires V2 before association/candidate/seal, retains the lease, performs exactly one actual Ceremony CAS and proves committed state by same-locator readback. A real ActiveStore path captures StoreV1, atomically writes every required row/head/result/idempotency member and rereads the exact postcondition. Mutants cover no-op, partial-write, wrong-Store, wrong-row, false-success and stale-readback providers; acquisition/pre-dispatch drift, alias/symlink, facility/provider/Realm/locator substitution, ABA, restore, revocation and fence loss; wrong carrier, invalid seal, third root, definite non-occurrence and acknowledgement loss; PreStore side effects; double consumption, clone, serialization, caching, replay, raw-CAS access, public construction and global lookup. Every pre/post-CAS crash cut preserves either old current state, typed recovery_required/in_doubt/integrity_blocked state, or exact committed Result with no blind retry.
  supersedes:
  - dec-canonical-persistence-owned-protected-ca82
  - dec-canonical-installation-owned-durable-f439
  preview: |-
    ProtectedLocatorAcquisitionRequestV2 (pre-candidate identity only)
      -> Persistence real no-follow acquisition
      -> ProtectedLocatorLeaseV2 held live
      -> association + candidate + seal under lease
      -> sealed candidate transition
      -> Ceremony-owned CAS + same-locator resolution

    ActiveStore: captured real StoreV1 -> atomic publication -> exact readback
    PreStore: inert validation only -> no Store/CAS ownership
  rejected:
  - |-
    Keep V1 and treat its candidate fields as hints: mandatory caller-built candidate evidence still makes acquisition post-candidate.
  - |-
    Acquire, drop and reacquire after derivation: replacement and ABA can occur between the two observations.
  - |-
    Remove only the generic callback port: necessary but insufficient because the V1 request ordering remains structurally wrong.
  - |-
    Let PreStore perform Store writes or own the protected CAS: this violates Installation finality and Ceremony ownership.
  - |-
    Use ambient Store or locator lookup, callbacks, stored digests, counts or acknowledgements as finality proof: each permits stale authority or false success.
  - |-
    Publish a V1 compatibility adapter: the contradictory ordering cannot be parity-proved and must remain historical negative evidence.
