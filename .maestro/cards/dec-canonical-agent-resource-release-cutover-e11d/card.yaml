  "description": "Mandate ref: the user-role next event in task 019f8416-e121-7703-8ab4-d3f9c3b374fa authorizes successor legacy-cutover design only. Fresh adversarial review selected Installation-owned physical activation with separate 31-resource and 35-ledger inventories, expected-preimage CAS and rollback. The review suggestion of one cross-domain atomic transaction and an active Recovery resource is rejected because the frozen design requires separate InstallationDomain and RepositoryDomain Results, one active embedded/bootstrap/MAESTRO.md source, and legacy Harness/RECOVERY as migration-only evidence.",
  "extra": {
    "locked_at": "2026-07-27T10:16:09.493Z",
    "decision": "AgentResourceReleaseCutoverV1 is one coherent Release-bound protocol with two strictly ordered, separately authorized, domain-local commits and no cross-domain transaction, Receipt, rollback or atomic-success claim. First, the InstallationDomain operation alone may physically stage, create, rewrite, replace, migrate, deactivate discovery for or restore the global Maestro Skill materialization, trusted activation links, host registrations, caches and global-skills-lock. Capability and Foundation supply sealed typed inventory, Resource, custody, expected-preimage, currentness and consumer-closure facts only; neither selects a mutable root or performs a write.\n\nThe global Release manifest binds exactly the 31 canonical embedded/vnext/capability/skills/maestro logical instruction Resources and separately binds all 35 legacy Skill-ledger files with exact Rewrite 19, Replace 9 and MigrationOnly 7 dispositions. The seven MigrationOnly reference files are sealed audit or rollback material only and never installed, discovered or aliased. Missing, duplicate, remapped, disposition-changed or legacy-name-as-successor rows refuse. global-skills-lock, cache objects, links, host descriptors and discovery records use backup-first expected-preimage CAS in one Installation journal. A changed lock, managed cache, link target, host consumer, custody claim, currentness fence, unmanaged collision or missing Release refuses before semantic publication. A crash or conflict after any physical effect routes Recover; it never warns and continues as current. Rollback is separately authorized, Release/root/journal exact, restores all admitted preimages and discovery state, proves postconditions and never deletes user-owned additions.\n\nOnly after the global commit, exact host reconnect and current Release reobservation may a fresh RepositoryDomain operation materialize the one canonical embedded/bootstrap/MAESTRO.md Resource as user-owned .maestro/MAESTRO.md and update the one exact root AGENTS.md SharedManagedBlock pointer. It never copies, translates or activates embedded/harness/HARNESS.md or embedded/harness/RECOVERY.md; those two are migration-only bytes preserved by LegacyQuarantineEpochV2 until their readers and holds close. Existing .maestro/MAESTRO.md or managed-block drift requires an explicit displayed diff, exact preimage backup and target-specific apply or force authorization; install, sync, update and passive checks never silently rewrite user bytes. Repository success or failure is its own honest Result and cannot roll back the already committed global InstallationDomain Result.\n\nLegacy Skill, Harness and Recovery discovery is deactivated only inside the owning domain after canonical targets are current, exact custody and expected-preimage checks hold, semantic consumers are zero or admitted sealed readers, the new canonical consumer is read back and rollback admission is recorded. No old name, old path, cli.md, project MCP, compatibility alias, automatic fallback or runtime legacy reader remains after success. Each domain finality joins the existing Distribution Receipt, claim, catalog, Result and context-correct MigrationCutoverAssociationV1 through its exact ActiveStore head or PreStore candidate seal. This Decision adds no Action, Ceremony, owner or public wire member; it materializes the already frozen Resource/Bundle/Release semantics and adds only proof-bound migration journal and association records.",
    "preview": "InstallationDomain Release journal\n  -> 31 canonical Skill Resources + 35 exact legacy dispositions\n  -> CAS lock/cache/link/host activation + reconnect\n  -> committed global Result\nthen fresh RepositoryDomain operation\n  -> embedded/bootstrap/MAESTRO.md -> .maestro/MAESTRO.md\n  -> exact AGENTS managed pointer\n  -> separate Result; legacy Skill/Harness/Recovery remain sealed only",
    "rejected": [
      "Reuse current update or sync writers: binary replacement may succeed while Skill sync only warns, lock replacement lacks exact CAS and stale pruning can occur after publication.",
      "Let Capability or Foundation activate targets: typed semantic owners would gain Installation custody and mutable-root authority.",
      "Claim one atomic transaction across global Skill and repository bootstrap: RepositoryDomain and InstallationDomain have separate Stores, Results and rollback authority.",
      "Create a new active Recovery.md or retain Harness as fallback: frozen design selects only embedded/bootstrap/MAESTRO.md and treats both legacy Harness files as migration-only."
    ]
  }
