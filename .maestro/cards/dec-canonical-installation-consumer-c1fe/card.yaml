schema_version: maestro.card.v1
id: dec-canonical-installation-consumer-c1fe
type: decision
title: Canonical Installation consumer snapshot and consumer-closure receipt
status: locked
parent: maestro-whole-flow-architecture-refoundation
created_at: 2026-07-23T17:59:42.770Z
updated_at: 2026-07-23T17:59:42.800Z
extra:
  locked_at: 2026-07-23T17:59:42.800Z
  decision: |-
    This Decision incorporates without supersession the effective coherent-cutover closure of dec-canonical-coherent-installation-cutover-ebba plus dec-canonical-typed-migration-cutover-65b3, dec-post-main-resource-bundle-and-recipe-53e9 and dec-installation-writer-compatibility-2f11. It changes no public, persistent or wire schema, consumer stage, catalog, Resource, Bundle or Release.

    Persistence owns each retained context view and context-specific linearization carrier. Installation alone mints the sealed move-only process-local InstallationConsumerSnapshotV1<'view> as an exact context sum. ActiveStore binds one coherent current Installation Store read view; exact Store instance, state, activation and restore incarnation; Head and revision; Generation and ordinal; publication clock and currentness anchors; InstallationId, Realm and domain; InstallationCensusV1 identity and complete rows; current Release and writer-protocol, schema and migration epochs; declared consumer-root manifest; public Resource, Bundle and Release consumer closure; alias, manager and target roots; current claims, catalogs and descriptors; and the consumer stage derived from the sealed owning operation. PreStore is legal only for the pre-currentness consumer gate and binds the exact pre-association inactive candidate Store state and root closure; InstallationId, Realm and domain; candidate Installation census and complete rows; candidate Release and writer-protocol, schema and migration epochs; declared consumer-root manifest and candidate public, alias, manager and target closure; the sealed CeremonySpec and Attempt; protected source and candidate carrier; and expected-old protected locator root and CAS identity. It binds neither the final candidate root nor candidate seal, because both depend on the association and its consumer commitment. PreStore asserts no active current Head, installed currentness or activation. No caller count, digest, empty vector, stage selector or latest selector is admitted.

    Integration owns authenticated live host, process and connection observation and a sealed authoritative complete-universe HostConsumerAdmissionGuardV1<'host>. The guard binds every declared optional and required host slot; admitted host descriptor, binary, protocol and Release identity; connection and process incarnation; discovery, autoload, dispatch, old-reader and writer state; alias and legacy consumer membership; the complete admission-set epoch; and monotonic currentness and revocation fences. Integration cannot choose canonical roots, Store facts or absence. Acquiring the guard closes or fences every admission path that could add, remove or change a process, connection, discovery or autoload reader, alias consumer, legacy host or declared slot. The guard remains live through the exact ActiveStore transaction or PreStore protected-CAS linearization point; any membership or fence change revokes the candidate and prevents finality. Host or network I/O completes before the Store view or protected-CAS critical section; only bounded local fence recheck occurs while the retained carriers remain live.

    Installation joins the context snapshot and admission guard and proves complete admitted public-root and host-universe coverage for exactly one of the three already frozen owner-derived stages: active-consumer zero before currentness, typed sealed-reader closure during protected retention, or reader zero before physical pruning. The caller cannot choose or relabel the stage. Installation issues one sealed move-only process-local ConsumerClosureReceiptV1<'view,'host> only for the exact owning operation and stage.

    For pre-currentness ActiveStore finality, Persistence and Integration recheck identical Store and admission facts at the existing 65b3 same-domain transaction linearization point. Receipt consumption deterministically constructs and validates the exact canonical pre-currentness consumer rows and existing 65b3 consumer commitment: candidate material field consumer_set_id is the commitment carried by frozen persisted association field consumer_gate_result_id. The same transaction commits that commitment with the association, Receipt, Distribution commit and current-Head join. ActiveStore success is all-or-none.

    For pre-currentness PreStore finality, receipt consumption first deterministically constructs and validates the same existing consumer commitment from the exact canonical rows while the pre-association snapshot and admission guard remain live. Migration writes the inert association containing consumer_gate_result_id into the inactive candidate Store, then computes the final candidate root and candidate seal from that association, rechecks the identical pre-association root lineage, expected-old protected locator, host-admission epoch, connection incarnations and revocation fences, and dispatches the existing protected expected-old CAS. Receipt identity and its transaction-local nonce are never persisted. The consumer commitment is the only receipt-derived durable value.

    The later protected-retention and physical-pruning receipts do not rewrite, replace or re-consume the 65b3 association or consumer_gate_result_id. Each is consumed once by its existing sealed owner operation. Protected retention separately proves that every remaining reader is an admitted typed sealed migration, rollback or audit reader. Physical pruning separately requires exact reader zero, hold zero, fresh custody and Authority, rollback and erasure safety, and LegacyRemovalAuthorization. Import, association, cutover, retention and pruning operation cuts do not create additional consumer stages.

    Wrong context, owner operation, stage, Store, Realm, domain, Release, root or host set, Generation, Head, pre-association root, expected-old carrier, admission epoch, currentness, protocol or meaning refuses. Before any candidate or finality effect, drop, mismatch or revoked fence yields zero write. ActiveStore then has all-or-none visibility. In PreStore, a refusal after the inert association or candidate material is written promises zero currentness and zero protected-CAS finality publication, not zero Migration write; inert material remains non-authoritative. Known partial state is recovery_required and unknown protected-CAS occurrence is in_doubt, resolved only by exact same-Ceremony, same-Attempt readback under fresh branch authority, never asserted absent and never blindly retried. No refusal refunds or repeats an already committed prerequisite effect or Authority debit.

    Every receipt is single-use and owner-operation-specific. Durable association uniqueness, finality and idempotency remain the existing 65b3 transaction or protected CAS, not any ephemeral object.

    The snapshot, guard and receipt have private fields, non-static lifetimes, are not Send or Sync, and have no public or crate-wide constructor, Copy, Clone, Default, Debug, accessor, serialization, canonical bytes, persistence, cache, registry, log form, wire form, Resource identity, replay or restart handoff. Installation, Persistence and Integration expose only sealed owner ports; consuming owners receive only the exact nominal stage type. A restart-surviving handoff is out of scope and reopens Design before any schema change.

    Proof covers both pre-currentness contexts and all three stages; raw count, digest, empty-vector and caller-stage adapters; missing, duplicate and extra roots or hosts; undisclosed alias or consumer; optional versus required host slots; new admission at every cut; disconnect, reconnect, process restart, role, protocol or Release change; old or mixed writer; ActiveStore restore or activation ABA; PreStore pre-association-root, final-root, candidate-seal or expected-old CAS mismatch; wrong Head, Generation, currentness or admission epoch; two consumers; drop, crash and replay; ActiveStore atomic refusal; PreStore pre-effect refusal, inert-write recovery_required and unknown protected-CAS in_doubt same-Attempt readback; deterministic consumer_set_id to consumer_gate_result_id equality; no association rewrite at later gates; typed-reader-only retention; pruning reader-zero plus hold, custody, Authority, rollback, erasure and LegacyRemovalAuthorization conjunction; coarse nondisclosure; exact fresh owner-stage success; no raw production adapter; and unchanged schema and catalog.
  preview: |-
    owner-derived pre-currentness, protected-retention or physical-pruning operation
      -> Installation context snapshot plus Integration admission guard
      -> one stage-specific ConsumerClosureReceiptV1
      -> existing owner linearization and durable commitment
      -> exact success, inert PreStore recovery state or fail-closed refusal
  rejected:
  - 'Accept caller-attested counts, digests, absence or stage: a caller could omit consumers or relabel the required gate.'
  - 'Allow Migration to mint the snapshot, guard or receipt: Migration does not own Installation context or live host admission.'
  - 'Let Integration select canonical roots or Store absence: Integration owns authenticated host observation and admission fencing only.'
  - 'Use an observed-only host list without an admission fence: a consumer could appear after the check and before finality.'
  - 'Accept raw host strings or paths, latest or current heuristics, or a cached global process census: none proves complete current membership.'
  - 'Bind the final candidate root or seal as a pre-association input: both depend on the association and create a cycle.'
  - 'Persist or serialize the receipt, or make closure optional or default: an ephemeral proof would become replayable authority.'
  - 'Invent import, association or cutover consumer stages: the locked model has exactly pre-currentness, protected-retention and physical-pruning gates.'
  - 'Rewrite or re-consume the 65b3 consumer gate during retention or pruning: later gates belong to their existing owner operations.'
  - 'Prune without reader zero, hold zero, custody, Authority, rollback, erasure safety and LegacyRemovalAuthorization: consumer closure alone cannot delete protected material.'
  - 'Create a cross-Store atomic transaction or treat the receipt as Authority, installed currentness or durable finality: those owners and boundaries remain unchanged.'
  - 'Promise zero Migration writes after PreStore inert writes or protected-CAS dispatch: uncertainty must preserve inert material and exact recovery.'
  - 'Allow restart handoff or any public, schema, catalog or Resource delta: this Decision authorizes process-local internal materialization only.'
