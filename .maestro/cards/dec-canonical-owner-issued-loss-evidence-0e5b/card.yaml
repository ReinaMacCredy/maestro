schema_version: maestro.card.v1
id: dec-canonical-owner-issued-loss-evidence-0e5b
type: decision
title: Canonical owner-issued unavailable-preexisting-loss evidence closure
status: superseded
parent: maestro-whole-flow-architecture-refoundation
created_at: '2026-07-28T10:16:03.000Z'
updated_at: '2026-07-28T10:28:54.000Z'
description: The clean Stage-11 candidate accepts an optional caller-supplied digest
  as unavailable-preexisting-loss evidence, carries it through owner admissions without
  authenticating historical membership, and lets Migration materialize a persisted
  loss row from that scalar. This contradicts the locked rule that unavailable bytes
  require independently issued owner evidence and cannot be repaired by strengthening
  the existing V3 constructor.
extra:
  locked_at: '2026-07-28T10:16:03.000Z'
  decision: |-
    Supersede dec-canonical-live-set-migration-census-and-8e6a only where its unavailable-preexisting-loss acquisition, validation and materialization path remained implicit. Preserve every unaffected live-set, classification, present-byte custody, overlap, rollback, currentness, Stage-12 sighting and protected-primary law, and preserve the physical-authority laws of dec-canonical-foundation-and-persistence-b79c until their separate successor is locked.

    Repository issues historical-loss evidence only for Repository-owned memberships, Installation only for Installation-owned memberships, and Persistence only for protected-primary memberships. Each owner persists an immutable canonical LegacySourceHistorySnapshotV1 while the source is still present. The snapshot is non-bearer audit state reachable through the owner Store's retained generation and history graph and binds issuer domain and provider revision, Store role and instance, historical head, generation, namespace epoch, Trust Root and Release, exact owner/root/source provenance, lossless relative locator commitment, object identity, node kind, expected length, content digest and metadata commitment. Git-object existence, timestamps, current absence, packet assertions, arbitrary digests, zero placeholders, detached census objects and orphan Store objects authenticate nothing.

    A separate owner-local production history provider atomically validates the retained snapshot against the current Store and mints one private OwnerIssuedUnavailablePreexistingLossEvidenceSetV1. It is process-local, private-field, move-only, one-use, non-Clone, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync and non-wire, with no scalar constructor, accessor, registry, conversion, Resource, Action or ScopeAtom representation. It additionally binds the current Store generation, head and revision, namespace epoch, Trust Root, Release, provider, mount, anchor, fence, revocation revision, exact expected-source-set identity, operation attempt and the owner admission/currentness identity used by the same Foundation invocation. Persisted history without fresh process-local issuance is insufficient; a process-local capability without qualifying pre-loss persisted owner history is insufficient.

    Remove every optional or scalar loss-evidence field from the production expected-source and caller contracts. Owner admission consumes its real history provider and transfers only the opaque evidence set into Foundation. Foundation consumes the complete set once while holding all owner leases, retained descriptors and fences. Present bytes always classify Present, even when retained history exists. One absent expected source requires exactly one owner-matching witness with exact historical and current bindings. Foundation binds pass A and pass B absence, exact-locator non-membership, admitted-set identity, invocation, descriptor/root commitments and final owner currentness into FoundationValidatedUnavailablePreexistingLossReceiptV1. Missing, duplicate, ambiguous, stale, revoked, wrong-owner or unmatched evidence refuses the whole epoch before custody writes. A source that disappears after admission is SourceChanged and triggers physical failure and rollback; it is never reclassified as preexisting loss.

    Migration receives only opaque source-case identities, semantic classifications and the Foundation receipt. It receives no path, root, locator, descriptor, Store reader, history provider, evidence constructor or raw loss fields. Rotate the authenticated internal loss closure to UnavailablePreexistingLossV4 and UnavailablePreexistingLossManifestV4. Each row binds the source-case identity, owner snapshot and issuer identities, historical tuple, owner admission/currentness, Foundation absence receipt and unique validation invocation. The manifest is canonically empty when all sources are present. The persisted V4 row is audit evidence only and cannot mint, reacquire or replay authority. Rotate every dependent rollback, currentness, LegacyQuarantineEpoch, LegacyRemovalGuard and Stage-12 coordinator/proof identity that binds the loss manifest; V3 candidate records remain immutable historical evidence and have no adapter, upgrade or current-authority path.

    Owner admission and evidence issuance use one coherent Store read snapshot. Foundation acquisition and finalization atomically recheck the same head, generation, state revision, namespace, Trust Root, Release, provider, mount, anchor, fence and revocation tuple with descriptor, custody and candidate facts. Any drift, including A-to-B-to-A replacement, invalidates the entire attempt. Crash or restart destroys the process-local capability; cleanup and recovery require a fresh owner acquisition under a new invocation. If bytes are already absent and no qualifying retained pre-loss snapshot exists, success is impossible. Recovery is limited to restoring exact bytes from independently verified backup evidence and rerunning as Present, or reacquiring from an already-existing retained owner snapshot. There is no force, operator assertion or manual digest bypass.

    Stage 11 owns the three production history providers, private evidence transfer, Foundation consumption and V4 loss closure. Test adapters must create authenticated history while bytes are present and then exercise deletion, ambiguity, rotation, revocation and replay; they cannot expose a production scalar-construction path. Stage 12 rotates only dependent guard, coordinator and cumulative proof identities. This Decision changes no public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member.
  superseded_by: dec-canonical-loss-root-reconciliation-eeea
  supersedes:
  - dec-canonical-live-set-migration-census-and-8e6a
  preview: owner-retained pre-loss history + fresh owner Store currentness -> one-use
    owner evidence set -> Foundation two-pass absence receipt -> Migration V4 audit
    row or whole-epoch refusal
  rejected:
  - 'Keep Option<[u8; 32]> and reject zero: this authenticates formatting, not historical
    ownership or currentness.'
  - 'Persist a caller-built receipt or use only a process-local capability: the former
    is replayable bearer-like data and the latter cannot prove existence before loss.'
  - 'Let Foundation, Migration, Git or an operator mint historical evidence: each
    makes physical absence or caller policy self-authenticating.'
