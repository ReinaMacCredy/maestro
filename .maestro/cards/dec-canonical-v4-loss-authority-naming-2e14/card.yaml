description: Final adversarial readback found one ambiguous sentence in the first
  typed final-cut successor. LegacyRemovalGuardV3 is the current guard, so saying
  forbidden inputs cannot produce “V3 authority” could be read as denying the
  intended current authority instead of denying V2/V3-loss adaptation.
extra:
  locked_at: '2026-07-28T10:37:15.000Z'
  decision: |-
    Supersede dec-canonical-v4-loss-bound-final-cut-3e18 only to make its current-authority name exact. Incorporate every private minting, field binding, one-use, no-target, Installation continuation, isolated candidate-ref CAS, crash-resolution, effect-inert proof, primary-protection, cumulative-seal and public-zero-delta law from that Decision without semantic change.

    LegacyRemovalGuardV3 is the sole current product removal authority for the authenticated V4 loss family, and Stage12LegacyCutCoordinatorV3 is the sole exact V8 packet-bound isolated candidate-cut authority. A LegacyRemovalGuardV2, Stage12LegacyCutCoordinatorV2, V3 loss manifest or epoch, scalar digest, caller-built manifest, adapter or conversion cannot produce current V4-loss-bound removal authority. The exact current inputs remain FoundationLegacyQuarantineClosureV2, UnavailablePreexistingLossManifestV4, LegacyRollbackAssessmentV4 and LegacyQuarantineEpochV4 joined with the unchanged-shape source, sighting, classification, overlap and sealed-quarantine manifests named by the predecessor.

    All V2 guard/coordinator and V3 loss/epoch values remain immutable historical evidence only. No public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member changes.
  supersedes:
  - dec-canonical-v4-loss-bound-final-cut-3e18
  preview: V4 loss/root/rollback/epoch closure -> current LegacyRemovalGuardV3; V2 guard/coordinator and V3 loss/epoch inputs -> explicit refusal
  rejected:
  - 'Edit the locked predecessor sentence in place: locked Decisions remain immutable and corrections use a successor.'
  - 'Call every guard generation V3 authority: the authority family is defined by exact typed inputs, not the guard suffix alone.'
