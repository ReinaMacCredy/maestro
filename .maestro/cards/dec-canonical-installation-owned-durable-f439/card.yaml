id: dec-canonical-installation-owned-durable-f439
type: decision
title: Canonical Installation-owned Durable Finality Provider
status: locked
parent: maestro-whole-flow-architecture-refoundation
created_at: 2026-07-26T03:39:32.242Z
updated_at: 2026-07-26T03:39:32.245Z
extra:
  locked_at: 2026-07-26T03:39:32.245Z
  decision: |-
    Installation owns a sealed move-only DurableInstallationFinalityBackendV1<'effect> carrying exactly one owner-bound durable effect provider and one nominal context variant. The backend is acquired only by the exact Installation owner operation and binds InstallationId, Realm and InstallationDomain; operation and owner stage; exact Store instance and activation incarnation or CeremonySpec and Attempt; Release, writer protocol, schema and migration epochs; census and consumer-set commitments; association identity and complete association meaning; Distribution commit identity; expected-old owner state; unique invocation and idempotency meaning; currentness, fence and revocation state; carrier commitment; retained host-admission fence; and the exact postcondition that must be read back. The provider is captured inside the backend, never supplied as a generic callback, caller argument or late lookup, and cannot be replaced by a closure that merely returns success.

    In ActiveStore, the provider owns the exact canonical same-domain Store transaction, current Head, Generation and retained currentness capability. After completing external observation, and while the retained Store view, Authority facts, consumer snapshot/closure and host-admission guard remain current, it enters that transaction, rechecks every expected-old and participant commitment, validates canonical consumer rows and exact consumer_set_id equality, then atomically publishes the existing Distribution Receipt and commit record, exactly one MigrationCutoverAssociationV1 with consumer_gate_result_id, the owning-domain current-Head join, owner Result and idempotency mapping. Before returning success, it performs an owner-local postcondition readback through the same transaction or its exact committed successor view and proves every durable row, commitment, Head and Result visible and mutually consistent. A callback return, row count, caller digest or unverified commit acknowledgement cannot substitute. Precommit failure produces zero durable effect. A lost acknowledgement is resolved by exact idempotency and postcondition readback and cannot become a post-write Changed refusal or blind retry.

    In PreStore, the provider is strictly inert with respect to Store, network, protected-locator and currentness mutation. It performs no association write, candidate materialization, protected CAS or publication. It validates the already materialized inactive association and complete consumer commitment, final candidate root, candidate seal, CeremonySpec, Attempt, carrier and postcondition through owner-held read capabilities, and joins the live ProtectedLocatorLeaseV1 required by the separate protected-CAS finality continuation. It proves that the sealed candidate postcondition is exact and current immediately before that continuation may cross finality. Inert success grants no authority and performs no effect; mismatch or unavailable readback refuses. Association materialization and sealing remain Migration/Installation owner work before this inert validation, while the existing Ceremony owner alone dispatches and resolves the protected CAS. Known inert material may remain recovery_required; unknown protected-CAS occurrence remains in_doubt under the same-Ceremony, same-Attempt resolution law.

    The ActiveStore and PreStore variants are nominally disjoint and cannot be selected, relabeled or downcast by callers. Migration supplies typed association meaning but owns neither durable Store access nor finality. Persistence supplies retained Store/current-view and locator capabilities; Installation owns the semantic join and backend; the existing Ceremony owner retains protected PreStore CAS. Every finality attempt consumes its backend once. Same-key completed replay returns only the exact durable Result after readback and performs no backend acquisition or effect; capability replay remains forbidden. Wrong context, stage, Store, Realm, Release, association, consumer set, Head, candidate root, seal, Attempt, carrier, currentness or idempotency meaning fails closed.

    DurableInstallationFinalityBackendV1 and its provider are process-local, Installation-minted, move-only, non-cloneable, non-serializable, non-cacheable, non-replayable and non-transferable. They have private fields, private constructors and non-static lifetimes; no public or crate-wide constructor, Copy, Clone, Default, Debug, Send, Sync, 'static escape, accessor, downcast or conversion, generic success callback, canonical bytes, persistence, registry, cache, log form, Resource identity, wire representation, restart reconstruction, ambient Store access or hidden global lookup exists. Stage 5 freezes the nominal backend ports and test conformance seams; Stages 9 and 11 provide the real context-specific operations. Proof replaces the provider with no-op, partial-write, wrong-Store, wrong-row, false-success and stale-readback mutants; crashes at every ActiveStore write/readback cut; verifies PreStore zero-effect behavior; and rejects serialization, replay, double consumption and context relabeling.
  preview: |-
    Installation move-only finality backend
      ActiveStore -> exact owner transaction -> atomic rows + Head -> postcondition readback
      PreStore   -> zero-effect sealed candidate validation + locator-lease join
      wrong context or stale meaning -> fail closed
  rejected:
  - 'Accept a generic callback or closure that reports success: a no-op can mint apparent finality without a durable effect.'
  - 'Let Migration or an adapter open the Store or protected locator through ambient/global lookup: ownership, testability and exact context binding are lost.'
  - 'Treat transaction commit return or affected-row count as the postcondition: wrong rows or mixed Head/association state can still be reported successful.'
  - 'Let the PreStore provider perform hidden writes or the protected CAS: it must remain inert and cannot steal the existing Ceremony finality owner.'
