schema_version: maestro.card.v1
id: dec-canonical-foundation-descriptor-a128
type: decision
title: Canonical Foundation descriptor-anchored Migration census port
status: locked
parent: maestro-whole-flow-architecture-refoundation
created_at: 2026-07-23T17:54:57.762Z
updated_at: 2026-07-23T17:54:57.792Z
extra:
  locked_at: 2026-07-23T17:54:57.792Z
  decision: |-
    This additive materialization Decision incorporates without supersession every unaffected law of dec-v1-migration-cutover-2f11 and dec-post-main-resource-bundle-and-recipe-53e9. It changes no InventoryRowV1 field or meaning, Migration classification, public or persisted schema, catalog, Resource, Bundle or Release.

    Foundation owns one sealed descriptor-anchored census port. Migration owns source classification, disposition and admission meaning and supplies only an already admitted root capability plus explicit finite limits. The port's census(root, limits) operation retains the no-follow ancestor and root descriptor or handle closure, proves the exact root identity and mount identity, acquires an owner-proven writer and namespace mutation fence or a filesystem snapshot, monotonic journal or epoch with equivalent scan-wide exclusion, and performs both enumeration-and-read passes itself under that same protection. It returns a complete result only when the two independently collected canonical row sets and every bound identity and metadata value are exactly equal. If the backend cannot prove scan-wide mutation exclusion and ABA resistance, it refuses; timestamp and two-pass equality alone are insufficient.

    All descendant traversal, enumeration, metadata and content reads are descriptor- or handle-relative to the retained root. The implementation never uses an ambient child pathname, absolute reopen, canonicalize result or final-path string as safety authority. It never follows a symbolic link, mount, volume, junction or reparse point. Every crossing candidate is classified from no-follow metadata beneath the retained parent; mount identity must remain the root mount identity. On Windows only IO_REPARSE_TAG_SYMLINK is representable as a symbolic-link row; every other reparse tag refuses. Directories may be traversed but are never admitted as leaf content.

    Every admitted leaf, including every symbolic link, must have no-follow link_count exactly one. If the backend cannot obtain trustworthy no-follow link count for a leaf, the entire census refuses. Regular files are read through the already validated no-follow handle. Symbolic-link rows contain the exact undereferenced link-target bytes. Hard links are never admitted. Sparse regular files bind logical byte length and the exact logical byte stream; allocation layout is not semantic. Alternate data streams, resource forks, extended attributes with semantic content, device nodes, sockets, FIFOs and any special or unsupported file kind refuse unless a separately locked versioned contract later defines them.

    The result uses the already frozen lossless VerifiedRelativeLocator representation. Platform-native relative-name bytes remain internal to Foundation until lossless construction succeeds; no lossy Unicode conversion, normalization, case folding or separator reinterpretation is allowed. Each row binds the exact relative locator, admitted kind, logical byte length, content or undereferenced link-target digest and the frozen InventoryRowV1 fields only. Foundation returns no Migration disposition, legacy meaning, target identity or synthetic row.

    For every directory and leaf, Foundation validates no-follow identity and relevant metadata before and after enumeration or read, including parent and root lineage, file identity, mount identity, type, link count, logical length and mutation-fence epoch. Limits cover maximum depth, entry count, logical bytes per leaf, total logical bytes, link-target bytes and platform name bytes with checked arithmetic. Any duplicate locator, identity alias, overflow, limit breach, race, mismatch, unsupported metadata or read error refuses the whole operation with zero partial rows.

    Unix and Windows implementations must prove semantic parity against the same sealed conformance suite. A platform that cannot express the descriptor-relative, no-follow, same-mount, single-link, lossless-name and scan-wide mutation-fence guarantees fails closed rather than falling back. Outward errors are coarse reason classes and disclose no untrusted target bytes or hidden filesystem topology.

    The returned census and its internal proof carriers are process-local sealed values with private fields. They have no public or crate-wide constructor, third-party implementor, serialization, canonical bytes of their own, persistence, cache, registry, wire form, Resource identity or replay role. Only Foundation may mint them; Migration may consume rows through the sealed port and independently applies the frozen classification law.

    Proof covers root replacement and ancestor swap; symlink, junction, reparse and mount crossing; descriptor enumeration followed by pathname substitution; hard links including symlink hard links; link-count acquisition failure; sparse logical bytes; alternate streams, forks, xattrs and special files; invalid or lossy names; duplicate relative locators and file identities; checked-limit overflow; mutation before, during and between both passes; ABA with equal size, time or digest; writer-fence loss; unsupported backend refusal; Unix/Windows vector parity; zero partial result on every failure; absence of synthetic rows and caller-supplied facts; no public or serializable carrier; and unchanged InventoryRowV1, schema, catalog and Resource closure.
  preview: |-
    admitted root capability plus finite limits
      -> retained no-follow root and mutation fence
      -> two descriptor-relative complete passes
      -> exact equality and lossless InventoryRowV1 rows
      -> Migration-owned classification or whole-census refusal
  rejected:
  - 'Use pathname walk, canonicalize, absolute reopen or final-path checks as safety authority: names can be substituted after validation.'
  - 'Retain only one root handle while reopening descendants by ambient paths: descendants escape the proven descriptor chain.'
  - 'Enumerate by descriptor and then read content through a pathname: the content object may differ from the enumerated object.'
  - 'Follow links and validate containment afterward: traversal has already crossed an untrusted edge.'
  - 'Use hashes, timestamps or two-pass equality without a scan-wide mutation proof: ABA and namespace races remain admissible.'
  - 'Admit hard-linked leaves, including symbolic links: another name can mutate the same admitted object outside the census root.'
  - 'Cross mounts, volumes, junctions or non-symlink reparse points: ownership and mutation fencing no longer cover the object.'
  - 'Convert native names or link targets lossily: distinct source bytes could collapse to one locator or meaning.'
  - 'Retry best-effort, return partial rows or synthesize unavailable facts: Migration could classify an incomplete or fabricated source.'
  - 'Delegate safety or row construction to the caller or Migration: Foundation owns physical traversal and byte observation.'
  - 'Expose public or serializable census implementors or cache a proof carrier: callers could fabricate or replay physical truth.'
  - 'Change InventoryRowV1, a public schema, catalog, wire contract or Resource identity: this Decision authorizes only the internal port.'
  - 'Supersede either incorporated Decision: their unaffected classification and Resource ownership laws remain active.'
