  "description": "Mandate ref: the user-role next event in task 019f8416-e121-7703-8ab4-d3f9c3b374fa authorizes successor legacy-cutover design only. Fresh adversarial review found that a cross-domain atomic join is impossible and that the current pruning seam accepts an unsafe authorization digest. This Decision separates the Authority-owned product guard from the external packet-bound source-tree cut, names the Stage12 coordinator, complete retained lease set, lock order and sole candidate-ref linearization, and leaves the protected primary read-only.",
  "extra": {
    "locked_at": "2026-07-27T10:19:56.632Z",
    "decision": "Authority owns LegacyRemovalGuardV1 with one private non-static cut lifetime. It is private-field, move-only, non-cloneable, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync, non-wire, non-Resource, non-Action, non-ScopeAtom and non-convertible; it has no public or crate-wide constructor, accessor, downcast, registry, generic callback path or scalar authorization representation. Authority mints it only inside the named product pruning admission after validating owner-issued facts and atomically rechecking Authority snapshot, epoch, Trust Root, fence, state token, currentness and revocation. It binds one realm, Release, Store Generation and head, unique cut invocation, exact legacy manifest and byte total, LegacyQuarantineEpochV2, replacement activation, consumer/reader/hold closure, rollback-rehearsal result and deletion-plan commitment. It grants no authority except one designated Installation physical-pruning continuation, which consumes it by value after final owner rechecks and its own expected-old linearization. Migration owns quarantine, classification, rollback evidence and the exact deletion plan; Foundation owns aggregate census and retained filesystem fences; Persistence owns Store/current-view and locator leases; Installation owns physical target custody and consumer/reader/hold finality. Operations coordinates and cannot mint, inspect or replay the guard. Any durable completion record is non-authorizing and cannot reconstruct it.\n\nThe currently unsafe digest authorization field and test-only generic pruning path become negative evidence. Production accepts only the opaque guard by value. Exact sorted manifests, row identities, paths, object kind, mode, byte digest, issuer/version and cross-links are required; counts alone never satisfy closure. Product pruning cannot run during this build because live installation, publication and external mutation remain forbidden.\n\nExternalProofControl owns the separate Stage12LegacyCutCoordinatorV1 for repository source pruning under the exact approved Build Packet. It retains, in fixed order, the protected-primary boundary descriptor; source Git-control binding; clean isolated-candidate expected ref/commit/tree; LegacyQuarantineEpochV2 and loss-evidence receipt; agent-resource activation proof; typed-successor parity proof; exact consumer-zero, runtime-reader-zero and retention-hold-zero manifests; rollback rehearsal; exact 210-entry source-to-canonical path/type/mode/byte parity map; Release and proof-registry currentness; then the post-prune tree commitment. None of these is a cross-domain transaction or product authority fact. The sole source-cut linearization is one expected-preimage compare-and-swap from the isolated candidate ref to the exact declared post-prune commit and tree. The protected primary is never a CAS target and remains byte-identical before and after.\n\nThe source deletion plan enumerates exactly all 349 observed rows and 68 files plus every code, Resource, test, script and generated-reference disposition. It is applied only after exact quarantine and successor materialization on the isolated candidate. A mismatch in any manifest, lease, currentness, revocation, preimage, path, object kind, mode, content, byte total, rollback result, consumer, reader, hold, Release, registry or protected-primary identity aborts before ref publication. Crash recovery resolves only expected preimage versus declared postimage under the same immutable plan; it never reconstructs a product guard or invents a third state.\n\nThe final cumulative runner remains effect-inert. It materializes the already committed post-prune candidate in clean disjoint roots and independently reexecutes semantic parity, negative compatibility, migration, rollback, 210 promotion parity and zero consumer/reader/hold proofs. It never prunes, activates, publishes, releases, installs or touches primary. This Decision adds no Action, Ceremony, catalog member or public wire shape. Product guard implementation and parity tests are in scope; live product pruning and external activation are not.",
    "preview": "Owner facts and retained leases -> Authority validates -> one-use LegacyRemovalGuardV1 -> Installation product pruning only\n\nApproved packet + exact non-authorizing receipts -> Stage12LegacyCutCoordinatorV1 -> one isolated candidate-ref expected-preimage CAS -> clean post-prune commit\n\nfinal three-engine runner -> read-only reexecution; primary untouched",
    "rejected": [
      "Use a 32-byte authorization digest or caller-built proof object: a scalar can be copied, substituted and replayed and proves no owner currentness.",
