- schema_version: maestro.card.v1
  id: dec-canonical-live-set-migration-census-and-8e6a
  type: decision
  title: Canonical live-set Migration census and quarantine epoch
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-27T14:32:37.947Z
  updated_at: 2026-07-28T10:16:03.000Z
  description: The V5 fixed-349 contract binds historical open-world matcher sightings as current byte-total authority. Live clean successor 1f65f98b deterministically observes 385 sightings across 70 files, so the old currentness claim is false and cannot be repaired without a versioned internal proof-semantics successor.
  extra:
    locked_at: 2026-07-27T14:32:37.992Z
    decision: 'Rotate the unimplemented LegacyQuarantineEpochV2 contract to LegacyQuarantineEpochV3. The historical 349 sightings across 68 files, 14 provisional relations and 10 provisional overlaps become HistoricalLegacyObservationV1 comparison provenance only; they are never a current count, physical inventory cardinality, completeness invariant, removal prerequisite or currentness claim. Foundation alone derives and retains admitted physical scope, descriptors and a one-use source-copy continuation. Migration receives opaque source cases and owns only their classifications, dispositions, present-byte quarantine records, unavailable-preexisting-loss records, declared overlap semantics, rollback assessment and epoch identity. MembershipKeyV3 binds owner domain, owner-minted root binding, lossless display locator, resolved locator commitment, object identity, node kind and metadata commitment. SourceCaseV3 additionally binds the Foundation census invocation, payload-state tag, exact length and digest. Stage12SightingV2 binds one SourceCaseV3, rotated policy identity, rule, matcher, matched bytes and byte offset; multiple sightings never multiply preserved bytes. Every present source is copied from a retained descriptor and rechecked for bytes, length, digest, metadata, object and descriptor facts. Every truly unavailable source requires independently issued historical length, digest, metadata, provenance and loss-evidence identity; placeholders and Git existence alone never suffice. Protected-primary memberships remain distinct read-only cases and only exact owner-declared overlap pairs are admitted. Finalization atomically rejoins owner admissions, Foundation root set and invocation, Release, Store Generation and head, namespace epoch, Trust Root, provider, mount, anchor, fence, classification policy, candidate commit and tree, protected-primary boundary, rollback plan, currentness and revocation. Drift yields no epoch and no removal authority; retry creates a new immutable epoch. Stage 12 remains a read-only sighting observer: the pre-cut count is diagnostic and may change only through a fresh deterministic manifest, while final success still requires zero current legacy sightings, consumers, readers and holds. No source tree, protected primary, installation, publication, Release or live external root is mutated by this Decision or its design proof.'
    superseded_by: dec-canonical-owner-issued-loss-evidence-0e5b
    supersedes:
    - dec-canonical-byte-total-legacy-quarantine-33c9
    preview: Foundation retained live-set census -> Migration SourceCaseV3 classifications -> exact present bytes or independent loss evidence -> LegacyQuarantineEpochV3 -> final owner/currentness recheck; historical 349 remains comparison only
    rejected:
    - 'Keep 349 as a golden count: confuses historical literal sightings with live physical truth.'
    - 'Remove count equality but accept arbitrary rows: loses owner-derived case completeness and per-case disposition.'
    - 'Treat missing primary bytes, Git objects or zero placeholders as loss proof: violates stop-before-loss.'
- schema_version: maestro.card.v1
  id: dec-canonical-foundation-and-persistence-b79c
  type: decision
  title: Canonical Foundation and Persistence legacy quarantine physical closure
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-27T14:32:57.978Z
  updated_at: 2026-07-28T10:16:23.000Z
  description: The prior lease consumes fences before classification and copying, accepts caller-derived paths through Migration, rejects all owner-declared protected overlaps, and proves quarantine separation lexically only. It cannot satisfy the locked post-copy descriptor, mount, realm and no-hidden-reader laws.
  extra:
    locked_at: 2026-07-27T14:32:58.008Z
    decision: FoundationLegacyQuarantineLeaseV1 is the sole physical authority for the Stage 11 epoch. It fully succeeds the effective V2 production contract dec-canonical-foundation-owned-admitted-d215 and incorporates the laws of its already-superseded predecessor dec-canonical-foundation-owned-aggregate-f9e7; no V2 admission, lease, adapter or conversion may produce current authority. RepositoryRootAdmissionV3 and InstallationRootAdmissionV3 are minted only by their real owners from live stores and registries; callers and Migration supply no paths, roots, counts, optionality, absence or currentness. Persistence separately mints a read-only ProtectedPrimaryBoundaryLeaseV1 and a move-only QuarantineCustodyLeaseV1 from the real protected-locator and custody backends. The custody lease binds retained backend handle, lossless canonical locator, descriptor chain and object identity, mount and provider incarnation, manager and security realm, expected-old state, fence, currentness and revocation, and grants no general reader. Foundation consumes all admissions and leases once, hashes the canonical ordered complete root membership and pair set, and holds every root descriptor, retained leaf capability and component fence concurrently across pass A, pass B, Migration classification, source copying and the final recheck. Duplicate roots, ancestor or descendant roots and cross-root aliases refuse except a bijective ProtectedPrimaryOverlapPairV1 minted by Foundation only after both owner admissions nominate the memberships and Foundation proves the same object. Each pair binds both membership identities, owner attestations, locators, root bindings, object, mount/provider facts, content and metadata commitment and owner currentness; it grants no deduplication, deletion, relinking, ownership transfer or primary mutation. FoundationSourceCopyContinuationV1 exposes only one-use opaque source tokens and descriptor-serviced bytes or metadata. Migration never receives a path, descriptor, root, reader or reopen authority. Persistence writes only through the retained custody lease. Custody must be outside every active display and resolved root and the protected primary by locator containment, descriptor and object identity, mount and provider identity, anchor and manager/security realm; it is non-active, non-bearer and absent from discovery, runtime, compatibility, Release, installation and ordinary Persistence readers. Only a separately authorized identity-bound offline recovery export may reacquire a reader and it can never be fallback behavior. After all copies, Foundation rechecks every root, leaf, overlap pair, primary boundary, active-root membership, object, content, metadata, path chain, provider, mount, namespace, fence and custody tuple; Persistence then rereads custody and protected-locator currentness and seals the exact candidate under expected-old authority. Only the joined FoundationLegacyQuarantineClosureV1 and Persistence receipt can support LegacyQuarantineEpochV3. Any missing or extra admission, pass mismatch, fence loss, rename, replacement, ABA, alias, mount or realm collision, partial copy, source reopen, currentness drift or revocation yields zero epoch and zero removal authority. Unsupported platforms refuse production success.
    superseded_by: dec-canonical-owner-resolved-root-universe-fabd
    supersedes:
    - dec-canonical-foundation-owned-aggregate-f9e7
    - dec-canonical-foundation-owned-admitted-d215
    preview: owner admissions + primary/custody leases -> Foundation simultaneous retained descriptors -> two passes -> opaque classification/copy -> post-copy physical recheck -> Persistence expected-old custody seal -> closure or whole-epoch refusal
    rejected:
    - 'Strengthen string denylist tests while retaining caller paths: negative syntax checks cannot prove owner-derived scope.'
    - 'Let Migration validate then retain roots or custody: validation does not transfer physical authority.'
    - 'Use a same-mount sibling directory or lexical path separation: aliases, bind mounts and manager discovery remain possible.'
- schema_version: maestro.card.v1
  id: dec-canonical-current-manifest-typed-c80f
  type: decision
  title: Canonical current-manifest typed successor closure
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-27T14:33:15.317Z
  updated_at: 2026-07-27T14:33:15.348Z
  description: The public successor semantics remain correct, but the locked 108-row pre-cut count is historical and live successor 1f65f98b now observes 109. Current closure must bind exact sighting membership rather than a scalar count.
  extra:
    locked_at: 2026-07-27T14:33:15.348Z
    decision: 'Projection remains the sole next-action authority and every frozen 7138 public contract remains byte-semantic unchanged: CLI maestro packet read, MCP maestro_packet, literal-discovery MCP maestro_cli_search, three Packet-read modes, six outcomes, AgentPacketV1, PacketRecipeBindingV1, ten vNext Recipe manifests and two Bounded Continuation profiles. Legacy next commands and all fifteen v1 Recipe identifiers remain negative-compatibility refusals that perform zero legacy read, Projection call, translation, mutation, cache, network or fallback. The fixed historical 108-next-row assertion is replaced by Stage12SightingManifestV2 bound to the rotated current policy and exact candidate commit and tree. Every deterministic pre-cut sighting must associate with exactly one live SourceCaseV3 and one disposition: current typed successor, admitted sealed audit reader or removal. The pre-cut count is diagnostic, not authority; the present clean successor observation of 109 next sightings is packet comparison evidence only and any subsequent membership change requires a freshly identity-bound manifest and classification. Missing, extra, duplicate, warning-bearing, unassociated or unclassified sightings refuse before replacement. Protected or dirty Recipe bytes enter LegacyQuarantineEpochV3 first through exact owner-bound source cases and declared overlaps. Stage 12 owns production activation of the already implemented candidate-only adapter route and must prove a concrete root CLI, MCP, TUI, Skill, hook and JSON consumer chain with exact parity and no third Tool or adapter-private alternate route. Final success requires zero active legacy-next sightings, zero non-admitted runtime readers, exact two-MCP equality, exact ten-Recipe identity equality, stale and foreign Release refusal and negative reintroduction proof. Rollback remains separately authorized, restores only exact journaled or quarantined preimages and never revives legacy names as automatic runtime fallback. This Decision adds no Action, Ceremony, schema, MCP Tool, Recipe, Resource, catalog or wire member.'
    supersedes:
    - dec-canonical-typed-successor-route-and-b049
    superseded_by: dec-canonical-exact-two-mcp-legacy-retirement-f3fd
    preview: current Stage12SightingManifestV2 -> every sighting bound to SourceCaseV3 and disposition -> Stage12 real public adapter parity -> post-cut zero sightings/readers; public 7138 surface unchanged
    rejected:
    - 'Change 108 to 109 as a new golden count: the same open-world currentness defect would recur.'
    - 'Alias legacy routes to packet read: leaves active legacy readers and hides mixed Release semantics.'
    - 'Accept adapter-private reachability as production closure: it does not prove the frozen public route is callable.'
- schema_version: maestro.card.v1
  id: dec-canonical-manifest-bound-one-use-legacy-d5db
  type: decision
  title: Canonical manifest-bound one-use legacy removal guard and final cut
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-27T14:33:33.505Z
  updated_at: 2026-07-28T10:29:14.000Z
  description: The predecessor removal guard and coordinator bind LegacyQuarantineEpochV2 and historical fixed counts. The live-set V3 epoch and manifest identities change the internal authorization basis, while public product semantics and the primary no-target rule remain unchanged.
  extra:
    locked_at: 2026-07-27T14:33:33.538Z
    decision: Authority owns LegacyRemovalGuardV2 with one private non-static cut lifetime and the same process-local, private-field, move-only, one-use, non-cloneable, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync, non-wire, non-Resource, non-Action and non-ScopeAtom capability law. Authority mints it only inside the named pruning admission after validating complete owner-issued facts and atomically rechecking Authority snapshot, epoch, Trust Root, fence, state token, currentness and revocation. It binds realm, Release, Store Generation and head, unique invocation, LegacySourceCaseManifestV3, Stage12SightingManifestV2, MigrationClassificationManifestV3, DeclaredOverlapManifestV2, UnavailablePreexistingLossManifestV3, SealedQuarantineManifestV3, LegacyQuarantineEpochV3, replacement activation, consumer-reader-hold closure, rollback rehearsal and exact deletion-plan commitment. No scalar count, digest-only input, historical 349 observation or caller-built manifest can authorize removal. Installation consumes the guard only in its exact product physical-pruning continuation after final owner rechecks and expected-old linearization; Operations coordinates and cannot mint, inspect, convert or replay it. Product pruning is implemented and parity-proved but never executed against live installations in this build. ExternalProofControl separately owns Stage12LegacyCutCoordinatorV2 for isolated repository source pruning under the exact approved replacement packet. It retains the protected-primary descriptor, source Git binding, clean successor preimage commit and tree, V3 quarantine and loss closure, replacement activation and adapter parity, exact consumer-reader-hold-zero manifests, rollback rehearsal, exact 210-entry namespace promotion map, Release and proof-registry currentness and declared post-cut tree in fixed order. Its sole write authority is one expected-preimage compare-and-swap from the isolated successor candidate ref to the declared post-cut commit and tree; primary is never a target. Crash resolution recognizes only the exact preimage or postimage. The coordinator cannot reconstruct or substitute an Authority guard, and the final proof runner remains effect-inert. Stage 12 integrates production adapter activation, executes the repository cut only on the isolated candidate, then freezes one exact Stage 0 through 12 closure for one independent Python, Rust and Ruby cumulative seal. There are zero interim seals, exactly one final receipt and one pointer. Any source-case, sighting, classification, overlap, loss, quarantine, activation, consumer, reader, hold, rollback, namespace, Release, Store, Git, primary-boundary, currentness or revocation drift refuses before the candidate-ref CAS.
    superseded_by: dec-canonical-v4-loss-bound-final-cut-3e18
    supersedes:
    - dec-canonical-one-use-legacy-removal-guard-7bf0
    preview: owner manifests + LegacyQuarantineEpochV3 -> Authority LegacyRemovalGuardV2 for product-only pruning; separately packet-bound Stage12 coordinator V2 -> one isolated candidate-ref CAS -> frozen effect-inert cumulative seal; primary never targeted
    rejected:
    - 'Patch the V1 guard to accept V3 by conversion: would make a locked capability contract silently polymorphic and replayable across epochs.'
    - 'Use zero counts or one aggregate digest as removal authority: omits exact source, loss, overlap and currentness provenance.'
    - 'Let the final seal runner perform pruning: proof execution must remain effect-inert and cannot own candidate-ref mutation.'
- schema_version: maestro.card.v1
  id: dec-canonical-host-native-injected-trusted-2ba1
  type: decision
  title: Canonical host-native injected trusted-host acquisition and truthful activation
  status: locked
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-28T00:16:20.000Z
  updated_at: 2026-07-28T00:16:20.000Z
  description: The locked trusted-host contract requires a concrete live already-authenticated host connection, but the clean successor exposes only a cfg(test) implementation and a dormant owner-local seam. No supported host descriptor binds a production provider, and stdio MCP has no authenticated-host capability to pass.
  extra:
    locked_at: 2026-07-28T00:16:20.000Z
    decision: |-
      Supersede only the acquisition and activation topology of dec-canonical-trusted-host-protected-1fbc. Preserve every unaffected pure-read, nondisclosure, non-oracle, exact-match, one-shot, currentness, revocation, allowlist, race, Stage-8 envelope, Stage-9 Store-provider and final parity law. Integration remains the sole owner of real host authentication acquisition and of the live authenticated connection lifecycle.

      The only positive production mechanism is same-process host-native injection. A supported host adapter that already owns one concrete LiveAuthenticatedHostConnectionV1 passes an exclusive mutable borrow into a crate-private MCP runtime entry before protected Store view acquisition. The runtime retains that exact borrow through Authority challenge creation, attestation minting and consumption, allowlisted envelope construction and the final identical host-currentness/revocation/connection-incarnation recheck. Connection acquisition and any host/provider I/O complete before the serialized Store view opens. While that view is held, the adapter may perform only the locked no-I/O snapshot and recheck operations. The borrow, challenge, invocation, attestation, presentation, guard and current projection cannot escape, be returned, stored or converted.

      Stdio is transport only. Standard input, JSON-RPC metadata, authenticated_host_connection_context_ref, request bytes, repository locator, CLI arguments, current directory, environment, UID, process ancestry, TTY, socket or file-descriptor numbers, prior Session or attestation, cached state, test fixtures and descriptor text cannot create, select, reconstruct or authenticate the connection. The context reference remains an untrusted equality hint after the injected connection is independently authenticated. There is no ambient registry, global lookup, public constructor, dynamic plugin search, credential parsing, wire bearer, serialization, persistence, caching, cloning, replay or fallback.

      Rotate the internal adapter descriptor to HostDescriptorV2 with a closed ProtectedRuntimeActivationBindingV2 value. Inactive binds one stable reason code and no provider fields. Active binds the exact compiled provider implementation identity and revision, host-owned acquisition entry identity, production conformance/negative proof identity, binary identity and Release. V1 descriptor bytes remain migration evidence only and cannot activate or adapt into V2. This internal descriptor rotation changes no public Packet, API, Tool, Action or catalog member. The existing agents-compatible-cli and claude-code profiles have no packet-proven host-native provider factory or connection injection contract and therefore publish V2 Inactive. Their ordinary MCP transport may still run, but it cannot claim provider-backed protected authentication.

      The canonical maestro mcp serve entry exposes the frozen exact-two read-only Tool surface. The compatibility commands mcp stdin and mcp list remain unresolvable and are never aliases. Without an injected supported host connection, every protected diagnostic request fails closed through the ordinary coarse unavailable class before protected subject resolution, Store reads or protected-byte construction. Unprotected Packet and literal-catalog reads retain their separate frozen authority. A future supported host integration requires a new exact host adapter implementation and V2 Active descriptor proof under this Decision; it does not require another semantic Decision if it preserves this mechanism exactly.

      Stage 10 owns the production host-native adapter seam, concrete supported-host provider when one actually exists, descriptor truthfulness and parity evidence. MainIntegration owns the crate-private runtime wiring that receives the borrow and preserves its lifetime through dispatch. Stage 12 owns production reachability and exact public adapter parity. Candidate-only Stage-10 seeds remain uncertified until compiled through the real runtime, and no test implementation can satisfy production activation. This Decision adds no Action, ScopeAtom, Ceremony, Grant, Mandate, Receipt, Result, Observation, Evidence, public field, wire schema, MCP Tool, Resource, Recipe, Bundle, Release or catalog member.
    supersedes:
    - dec-canonical-trusted-host-protected-1fbc
    preview: host-native authenticated adapter -> exclusive same-process connection borrow -> crate-private MCP runtime -> Authority one-shot challenge and no-I/O attestation -> Stage-8 envelope -> final same-borrow host recheck -> protected bytes or coarse unavailable
    rejected:
    - 'Invent a file descriptor, Unix socket, keychain, OAuth, environment token or context-string acquisition mechanism: no current supported host contract proves one, and each would create a new credential or bearer surface.'
    - 'Treat stdio transport identity as authenticated-host identity: JSON-RPC and process transport do not prove the locked Principal, Binding, Session or host-currentness facts.'
    - 'Mark current host descriptors active because a dormant trait and test adapter compile: descriptor truthfulness requires a real compiled provider and production conformance proof.'
    - 'Open the Store view before acquiring or while performing host I/O: that violates the bounded no-I/O linearization interval.'
- schema_version: maestro.card.v1
  id: dec-canonical-exact-two-mcp-legacy-retirement-f3fd
  type: decision
  title: Canonical exact-two MCP legacy retirement and full-suite parity
  status: locked
  parent: maestro-whole-flow-architecture-refoundation
  created_at: 2026-07-28T00:16:40.000Z
  updated_at: 2026-07-28T00:16:40.000Z
  description: The frozen current-manifest successor requires exactly two global read-only MCP Tools, while the production runtime and broad integration tests still enumerate or call the 42-tool legacy registry. The V6 denylist also withholds the server and legacy test files needed to close this contradiction.
  extra:
    locked_at: 2026-07-28T00:16:40.000Z
    decision: |-
      Supersede dec-canonical-current-manifest-typed-c80f only where it left production activation and legacy broad-suite retirement implicit. Preserve the complete Stage12SightingManifestV2, SourceCaseV3, Projection-only next authority, Packet modes and outcomes, ten Recipe manifests, two Bounded Continuation profiles, negative legacy-next refusal, rollback, zero-reader and zero-reintroduction laws.

      The global MCP runtime exposes exactly two and only two Tool names: maestro_packet and maestro_cli_search. Protocol tools/list, canonical CLI mcp tools, dispatch, embedded descriptor, generated catalog, host descriptors, external pattern, schema, tests and final consumer census must all derive or parity-prove the identical ordered pair. The compatibility CLI command mcp list remains unresolvable. No hidden registry, alias, deprecated name, dynamic extension, adapter-private list or compatibility dispatch survives. Unknown legacy Tool names fail as unknown before repository discovery, Store access, Projection invocation, mutation, cache, network, compatibility translation or fallback.

      maestro_packet requires one explicit alias-closed repository_locator input and never derives repository identity from current working directory, process state or ambient paths. It performs the frozen read-only Packet behavior through the real Projection provider. maestro_cli_search reads only the catalog embedded in the running installed binary and returns literal discovery results under the frozen schema; it never opens a repository, Store, legacy catalog or filesystem search root. Protected diagnostic access, when exposed by a frozen Packet mode, follows dec-canonical-host-native-injected-trusted-2ba1 and is coarse unavailable without an injected supported host connection.

      The existing 42-tool MCP tests are not preserved as MCP compatibility. Product behavior still required by those tests moves to the owning CLI, domain or operation suites and must use the real non-MCP public surface. MCP integration tests rotate to exact-two enumeration, exact descriptor equality, explicit locator and no-cwd behavior, coarse-unavailable protected requests without host injection, supported-host parity when a provider exists, legacy-name refusal before side effects, malformed and batch protocol behavior and zero hidden registry. Removing a legacy MCP assertion cannot remove the underlying product proof; the replacement packet must name the migrated or replacement test owner for every changed broad-suite case.

      MainIntegration is the sole shared-file authority for server dispatch, CLI MCP registration, root command wiring and the two broad integration suites. Stage12Product owns the exact-two product adapter, descriptor and dedicated parity fixtures. ExternalProofControl owns only final read-only census and seal tooling. The rotated default-deny ownership manifest must grant every exact touched path and must no longer deny src/interfaces/mcp/server.rs. Integration occurs after the Stage-10 and Stage-11 candidate ancestry is preserved and rebuilt on the exact successor design commit.

      This correction changes no frozen Tool count or public successor member: it makes the already locked exact-two surface real and removes contradictory legacy compatibility. It adds no Action, ScopeAtom, Ceremony, Grant, Mandate, Receipt, Result, Observation, Evidence, Resource, Recipe, Bundle, Release, public schema member or wire field.
    supersedes:
    - dec-canonical-current-manifest-typed-c80f
    preview: one exact generated two-Tool catalog -> CLI list + MCP list + descriptor parity -> explicit-locator maestro_packet or binary-local maestro_cli_search -> legacy names rejected before reads and writes -> broad product cases preserved in owning non-MCP suites
    rejected:
    - 'Keep the 42 legacy Tools behind hidden dispatch while listing two: violates consumer-zero and allows compatibility behavior to survive.'
    - 'Infer repository root from cwd for maestro_packet: ambient process state is not an alias-closed repository locator.'
    - 'Delete broad integration cases without replacement ownership: would trade API retirement for proof loss.'
    - 'Add a third protected-diagnostic Tool: the frozen public catalog is exactly two, and protected inspection must travel only through the locked Packet surface.'
- schema_version: maestro.card.v1
  id: dec-canonical-owner-issued-loss-evidence-0e5b
  type: decision
  title: Canonical owner-issued unavailable-preexisting-loss evidence closure
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: '2026-07-28T10:16:03.000Z'
  updated_at: '2026-07-28T10:28:54.000Z'
  description: The clean Stage-11 candidate accepts an optional caller-supplied digest
    as unavailable-preexisting-loss evidence, carries it through owner admissions without
    authenticating historical membership, and lets Migration materialize a persisted
    loss row from that scalar. This contradicts the locked rule that unavailable bytes
    require independently issued owner evidence and cannot be repaired by strengthening
    the existing V3 constructor.
  extra:
    locked_at: '2026-07-28T10:16:03.000Z'
    decision: |-
      Supersede dec-canonical-live-set-migration-census-and-8e6a only where its unavailable-preexisting-loss acquisition, validation and materialization path remained implicit. Preserve every unaffected live-set, classification, present-byte custody, overlap, rollback, currentness, Stage-12 sighting and protected-primary law, and preserve the physical-authority laws of dec-canonical-foundation-and-persistence-b79c until their separate successor is locked.

      Repository issues historical-loss evidence only for Repository-owned memberships, Installation only for Installation-owned memberships, and Persistence only for protected-primary memberships. Each owner persists an immutable canonical LegacySourceHistorySnapshotV1 while the source is still present. The snapshot is non-bearer audit state reachable through the owner Store's retained generation and history graph and binds issuer domain and provider revision, Store role and instance, historical head, generation, namespace epoch, Trust Root and Release, exact owner/root/source provenance, lossless relative locator commitment, object identity, node kind, expected length, content digest and metadata commitment. Git-object existence, timestamps, current absence, packet assertions, arbitrary digests, zero placeholders, detached census objects and orphan Store objects authenticate nothing.

      A separate owner-local production history provider atomically validates the retained snapshot against the current Store and mints one private OwnerIssuedUnavailablePreexistingLossEvidenceSetV1. It is process-local, private-field, move-only, one-use, non-Clone, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync and non-wire, with no scalar constructor, accessor, registry, conversion, Resource, Action or ScopeAtom representation. It additionally binds the current Store generation, head and revision, namespace epoch, Trust Root, Release, provider, mount, anchor, fence, revocation revision, exact expected-source-set identity, operation attempt and the owner admission/currentness identity used by the same Foundation invocation. Persisted history without fresh process-local issuance is insufficient; a process-local capability without qualifying pre-loss persisted owner history is insufficient.

      Remove every optional or scalar loss-evidence field from the production expected-source and caller contracts. Owner admission consumes its real history provider and transfers only the opaque evidence set into Foundation. Foundation consumes the complete set once while holding all owner leases, retained descriptors and fences. Present bytes always classify Present, even when retained history exists. One absent expected source requires exactly one owner-matching witness with exact historical and current bindings. Foundation binds pass A and pass B absence, exact-locator non-membership, admitted-set identity, invocation, descriptor/root commitments and final owner currentness into FoundationValidatedUnavailablePreexistingLossReceiptV1. Missing, duplicate, ambiguous, stale, revoked, wrong-owner or unmatched evidence refuses the whole epoch before custody writes. A source that disappears after admission is SourceChanged and triggers physical failure and rollback; it is never reclassified as preexisting loss.

      Migration receives only opaque source-case identities, semantic classifications and the Foundation receipt. It receives no path, root, locator, descriptor, Store reader, history provider, evidence constructor or raw loss fields. Rotate the authenticated internal loss closure to UnavailablePreexistingLossV4 and UnavailablePreexistingLossManifestV4. Each row binds the source-case identity, owner snapshot and issuer identities, historical tuple, owner admission/currentness, Foundation absence receipt and unique validation invocation. The manifest is canonically empty when all sources are present. The persisted V4 row is audit evidence only and cannot mint, reacquire or replay authority. Rotate every dependent rollback, currentness, LegacyQuarantineEpoch, LegacyRemovalGuard and Stage-12 coordinator/proof identity that binds the loss manifest; V3 candidate records remain immutable historical evidence and have no adapter, upgrade or current-authority path.

      Owner admission and evidence issuance use one coherent Store read snapshot. Foundation acquisition and finalization atomically recheck the same head, generation, state revision, namespace, Trust Root, Release, provider, mount, anchor, fence and revocation tuple with descriptor, custody and candidate facts. Any drift, including A-to-B-to-A replacement, invalidates the entire attempt. Crash or restart destroys the process-local capability; cleanup and recovery require a fresh owner acquisition under a new invocation. If bytes are already absent and no qualifying retained pre-loss snapshot exists, success is impossible. Recovery is limited to restoring exact bytes from independently verified backup evidence and rerunning as Present, or reacquiring from an already-existing retained owner snapshot. There is no force, operator assertion or manual digest bypass.

      Stage 11 owns the three production history providers, private evidence transfer, Foundation consumption and V4 loss closure. Test adapters must create authenticated history while bytes are present and then exercise deletion, ambiguity, rotation, revocation and replay; they cannot expose a production scalar-construction path. Stage 12 rotates only dependent guard, coordinator and cumulative proof identities. This Decision changes no public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member.
    superseded_by: dec-canonical-loss-root-reconciliation-eeea
    supersedes:
    - dec-canonical-live-set-migration-census-and-8e6a
    preview: owner-retained pre-loss history + fresh owner Store currentness -> one-use
      owner evidence set -> Foundation two-pass absence receipt -> Migration V4 audit
      row or whole-epoch refusal
    rejected:
    - 'Keep Option<[u8; 32]> and reject zero: this authenticates formatting, not historical
      ownership or currentness.'
    - 'Persist a caller-built receipt or use only a process-local capability: the former
      is replayable bearer-like data and the latter cannot prove existence before loss.'
    - 'Let Foundation, Migration, Git or an operator mint historical evidence: each
      makes physical absence or caller policy self-authenticating.'
- schema_version: maestro.card.v1
  id: dec-canonical-owner-resolved-root-universe-fabd
  type: decision
  title: Canonical owner-resolved complete declared-root universe lease and final Stage-11
    currentness
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: '2026-07-28T10:16:23.000Z'
  updated_at: '2026-07-28T10:28:54.000Z'
  description: The clean Stage-11 candidate treats opaque Installation census header
    references and four packet-derived classifications as if they enumerated the complete
    physical root universe. No production owner resolver materializes or holds the Repository,
    Active, Inactive, Snapshot, Cache, Archive, Host and Legacy declaration sets through
    finality, so omitted roots and owner drift can pass the current seam.
  extra:
    locked_at: '2026-07-28T10:16:23.000Z'
    decision: |-
      Supersede dec-canonical-foundation-and-persistence-b79c with FoundationLegacyQuarantineLeaseV2 and owner-resolved complete root-universe leases. Incorporate every unaffected descriptor, retained-copy, custody, protected-primary, overlap, rollback and expected-old finality law of that Decision and dec-canonical-foundation-descriptor-a128, and compose with the already locked owner-issued unavailable-preexisting-loss Decision. No V1/V2/V3 caller-root admission or conversion may coexist as current production authority.

      Repository and Installation each mint one nominal, non-convertible process-local lease from a coherent live owner/provider view: RepositoryDeclaredRootUniverseLeaseV1 and InstallationDeclaredRootUniverseLeaseV1. Each is private-field, move-only, one-use, non-Clone, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync and non-wire, with no scalar constructor, authority accessor, registry, conversion, Resource, Action or ScopeAtom representation. It holds the owner fence through finalization and binds the owner domain, internal universe format, nonzero monotonic declaration-set revision, realm, operation attempt, provider implementation and revision, currentness and revocation, plus one canonical row for every current declaration sorted by raw owner/declaration identity rather than display path or platform collation.

      The closed Repository universe contains its required Store root. The closed Installation universe contains every Active, Inactive, Snapshot, Cache, Archive, Host and Legacy declaration slot, including roots that ordinary discovery does not activate. Every row binds declaration identity, semantic role, requiredness, lossless declared-locator commitment and exactly one closed disposition: Present with an opaque retained-root acquisition capability; DeclaredAbsent with an owner absence fence only where versioned owner semantics explicitly permit absence; or Unsupported with a stable reason and provider identity. Required absence, present-but-unmounted or unreadable state, any unsupported production row, omission, extra row, duplicate or role substitution refuses the attempt. DeclaredAbsent is not unavailable-source loss. Cache is never fallback authority, snapshots and archives are never silently activated or deduplicated, and inactive roots remain non-discoverable while still entering the census.

      Repository owns only Repository declaration membership and Repository Store currentness. Installation owns completeness of the Installation union and may consume sealed Persistence facts plus an Integration-owned complete host-slot snapshot without fabricating their authentication or provider facts. Persistence owns retained Store-root, protected-primary and custody capabilities and physical currentness. Foundation alone acquires descriptors, derives root binding, object, mount, provider, anchor and fence facts, rejects duplicate, ancestor, descendant and cross-root aliases except the already locked bijective protected-primary overlap, and performs descriptor-relative scanning. No owner or caller opens a PathBuf, canonicalized string or header reference as authority.

      The owner-universe identity and Foundation admitted-set identity remain distinct. Each owner-universe identity binds all declaration rows, including absence and unsupported rows, declaration/provider revisions, Store or registry state and owner currentness. The admitted-set identity binds both owner-universe identities, the Foundation invocation and every derived physical binding. InstallationCensusHeaderV1 and InstallationCensusV1 remain byte-identical persisted/read-model artifacts; their DeclaredRootSet, HostAdapterSet and LegacyLocatorSet references are comparison provenance only. The current four-class filter may inform semantic comparison after owner equality is proved but never defines physical scope. Packet expected sources, invocation and finite limits may tighten or refuse the census but cannot add, omit or select roots. Caller paths, roots, lists, counts, optionality, absence, unsupported flags, descriptors, Store/head/generation scalars, provider facts, currentness and revocation are forbidden.

      Foundation consumes both owner leases plus protected-primary and custody leases once, proves canonical declaration-row equality, rejects unsupported or invalid absence, and retains every present descriptor and both owner fences simultaneously. It performs exact pass A and pass B across the whole admitted set, reconciles packet expected sources against the already-derived complete physical cases, exposes only opaque one-use source tokens and semantic source-case identities to Migration, retains all leases/descriptors/fences across classification and copying, then rechecks every physical root, absence fence, provider, declaration set, Store basis and owner currentness. Migration never constructs MembershipKeyV3 from a display or combined locator and receives no physical locator; Foundation derives and binds the existing MembershipKeyV3 and SourceCaseV3 field shapes from the owner-resolved physical case. Their persisted field schemas remain unchanged, while their production construction route and authority dependency rotate.

      Persistence seals custody under expected-old authority while the final owner fences remain live. Foundation then consumes both final owner rechecks and derives a closure binding both final-currentness commitments, protected-primary currentness, exact copies and the Persistence receipt. A changed declaration revision, Store or activation incarnation, Head or Generation revision, Contract Root, realm, provider, mount, anchor, attempt, fence or revocation rejects even if bytes return A-to-B-to-A. Before durable custody seal, any failure performs verified partial-copy rollback and yields no epoch or removal authority. After durable custody seal, a failed final owner recheck yields recovery_required or in_doubt; sealed custody remains inactive and non-authoritative until a fresh-attempt recovery resolves it, and the system never claims a false zero-write rollback.

      Stage 11 owns the real Repository Store provider, Installation declaration/host/legacy registry provider, Foundation aggregate lease and Persistence finality path. Test fixtures cannot satisfy production reachability. Rotate RepositoryRootAdmissionV3, InstallationRootAdmissionV3, FoundationLegacyQuarantineLeaseV1 and the detached execute_offline_live_set_v3 production seam to their owner-resolved successors; preserve the separately rotated authenticated V4 loss and dependent epoch identities. Stage 12 rotates only dependent removal/proof inputs. This Decision changes no Installation census bytes, public Packet, Operation, Result, Action, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member.
    superseded_by: dec-canonical-loss-root-reconciliation-eeea
    supersedes:
    - dec-canonical-foundation-and-persistence-b79c
    preview: Repository complete universe lease + Installation complete universe lease
      + primary/custody leases -> Foundation retained whole-set census and copy -> live
      final owner rechecks -> expected-old seal and closure or recovery-required refusal
    rejected:
    - 'Validate opaque census-header references or expand the four-class filter: neither
      proves enumeration equality, retained physical authority or final owner currentness.'
    - 'Revive caller &[Path] adapters or let Foundation discover roots from strings:
      both let callers or descriptor text define physical scope.'
    - 'Treat cache, snapshot, archive, inactive, host or unsupported rows as optional
      omissions: this permits incomplete preservation and fabricated loss.'
    - 'Persist one universe digest as authority: a replayable scalar cannot hold descriptors,
      fences or final currentness.'
- schema_version: maestro.card.v1
  id: dec-canonical-loss-root-reconciliation-eeea
  type: decision
  title: Canonical authenticated loss and declared-root reconciliation closure
  status: locked
  parent: maestro-whole-flow-architecture-refoundation
  created_at: '2026-07-28T10:28:54.000Z'
  updated_at: '2026-07-28T10:28:54.000Z'
  description: Adversarial review of the two first V8 successors found two missing joins.
    Protected-primary history has no Repository or Installation Store role, and a
    packet-expected source under a DeclaredAbsent root could otherwise be confused
    with authenticated leaf loss. The current typed closure also needs exact V4
    dependent names rather than an open-ended identity rotation.
  extra:
    locked_at: '2026-07-28T10:28:54.000Z'
    decision: |-
      Supersede dec-canonical-owner-issued-loss-evidence-0e5b and dec-canonical-owner-resolved-root-universe-fabd only to close their protected-primary history, root-disposition reconciliation and exact dependent-version gaps. Incorporate every other ownership, retained history, complete-universe, descriptor, two-pass census, custody, rollback, currentness, recovery and no-public-surface law from both Decisions.

      Repository and Installation history remain reachable through their matching owner Store generation/history graphs. Persistence instead owns one internal ProtectedPrimaryHistoryJournalV1 in the real protected-boundary backend. It is not a new StoreRoleV1 and does not enter Repository or Installation Store schemas. While protected-primary bytes are present, Persistence atomically appends an immutable canonical record bound to ProtectedPrimaryBoundaryLeaseV1 identity, locator and root commitments, object kind and identity, length, digest, metadata, source provenance, backend implementation/revision, provider, mount, anchor, fence, realm, Release, journal head/revision, currentness and revocation. A current protected-primary provider validates that retained journal record and mints only the Persistence-owned portion of OwnerIssuedUnavailablePreexistingLossEvidenceSetV1. Detached files, packet rows, Git objects and a record not reachable from the current journal head authenticate nothing. The journal is internal persisted audit state and grants no reader, locator, mutation or execution authority.

      Unavailable-preexisting-loss evidence is admissible only for a source whose owner-universe row is Present and whose retained root capability was acquired before pass A and remains held through finalization. If a packet-expected source maps beneath a DeclaredAbsent or Unsupported root, cannot map to exactly one Present owner row, or appears under a changed requiredness/disposition, Foundation refuses the entire attempt before consuming historical evidence or writing custody. DeclaredAbsent proves only the current absence of an optional declaration under an owner fence; it never proves historical leaf membership or loss. A stale, foreign, replayed or mismatched absence fence refuses. Packet expected-source equality is checked against the complete Present physical case set plus explicit absence/unsupported refusal rows, never against display paths or header references.

      The exact current typed closure is FoundationLegacyQuarantineLeaseV2 plus FoundationLegacyQuarantineClosureV2, UnavailablePreexistingLossV4, UnavailablePreexistingLossManifestV4, LegacyRollbackAssessmentV4 and LegacyQuarantineEpochV4. MembershipKeyV3, SourceCaseV3, Stage12SightingManifestV2, MigrationClassificationManifestV3, DeclaredOverlapManifestV2 and SealedQuarantineManifestV3 keep their persisted field shapes but rotate their authority dependency and final joined identity where they bind the V4 closure. V3 loss, rollback and epoch values are historical candidate evidence only; no conversion, upgrade, coexistence or fallback can produce current authority.

      Production proof must include a Repository Store witness, Installation Store witness and Persistence protected-boundary journal witness; Present-with-history, absent-with-valid-history, post-admission disappearance, no-history, orphan-history, wrong owner, wrong root and replay cases; expected-source-under-DeclaredAbsent and Unsupported refusal; requiredness and disposition flips; stale and foreign absence fences; every Store/journal/provider/currentness/revocation race; and recovery from exact restored bytes. This Decision changes no public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog, wire member, InstallationCensusHeaderV1 or InstallationCensusV1 bytes.
    supersedes:
    - dec-canonical-owner-issued-loss-evidence-0e5b
    - dec-canonical-owner-resolved-root-universe-fabd
    preview: owner Store history or protected-primary journal + Present retained root -> Foundation exact absence receipt -> V4 loss/rollback/epoch; DeclaredAbsent, Unsupported or missing history -> whole-attempt refusal
    rejected:
    - 'Add a third StoreRoleV1 for protected primary: it would silently change an existing persisted Store schema and collapse Persistence with Repository or Installation.'
    - 'Allow DeclaredAbsent plus historical leaf evidence: no retained root exists to bind exact pass-A/pass-B physical non-membership.'
    - 'Leave dependent versions implicit: a frozen typed guard or coordinator could otherwise accept the wrong epoch family.'
- schema_version: maestro.card.v1
  id: dec-canonical-v4-loss-bound-final-cut-3e18
  type: decision
  title: Canonical V4-loss-bound removal guard and final cut
  status: superseded
  parent: maestro-whole-flow-architecture-refoundation
  created_at: '2026-07-28T10:29:14.000Z'
  updated_at: '2026-07-28T10:37:15.000Z'
  description: The current locked removal Decision is typed to UnavailablePreexistingLossManifestV3,
    LegacyQuarantineEpochV3, LegacyRemovalGuardV2 and Stage12LegacyCutCoordinatorV2.
    The authenticated V4 loss closure cannot be consumed safely without an explicit
    typed successor; identity-only wording would leave two incompatible current heads.
  extra:
    locked_at: '2026-07-28T10:29:14.000Z'
    decision: |-
      Supersede dec-canonical-manifest-bound-one-use-legacy-d5db only where its removal and isolated-cut types bind the superseded V3 loss/epoch family. Preserve every unaffected private minting, one-use, no-target, exact-deletion-plan, rollback, consumer-reader-hold-zero, namespace-promotion, effect-inert proof, expected-preimage CAS, crash-resolution, primary-protection and one-final-seal law.

      Authority owns LegacyRemovalGuardV3 with the same private non-static cut lifetime and process-local, private-field, move-only, one-use, non-Clone, non-Debug, non-serializable, non-persistent, non-cacheable, non-replayable, non-Send, non-Sync, non-wire, non-Resource, non-Action and non-ScopeAtom capability law. Authority mints it only inside the named pruning admission after validating complete owner-issued facts and atomically rechecking Authority snapshot, epoch, Trust Root, fence, state token, currentness and revocation. It binds realm, Release, Store Generation and head, unique invocation, LegacySourceCaseManifestV3, Stage12SightingManifestV2, MigrationClassificationManifestV3, DeclaredOverlapManifestV2, UnavailablePreexistingLossManifestV4, SealedQuarantineManifestV3, FoundationLegacyQuarantineClosureV2, LegacyRollbackAssessmentV4, LegacyQuarantineEpochV4, replacement activation, consumer-reader-hold closure, rollback rehearsal and exact deletion-plan commitment. No V2 guard, V3 loss/epoch value, scalar digest, caller-built manifest or adapter can produce V3 authority.

      Installation consumes the guard only in its exact product physical-pruning continuation after final owner and Persistence expected-old rechecks. Operations coordinates and cannot mint, inspect, convert or replay it. Product pruning remains implemented and parity-proved but is never executed against a live installation in this build.

      ExternalProofControl owns Stage12LegacyCutCoordinatorV3 for isolated repository source pruning under the exact approved V8 packet. It retains the protected-primary descriptor, source Git binding, clean 1685b391 preimage commit and 2daa5f84 tree, V4 loss/rollback/epoch and Foundation closure, sealed quarantine, replacement activation and adapter parity, exact consumer-reader-hold-zero manifests, rollback rehearsal, exact 210-entry namespace promotion map, Release and proof-registry currentness and declared post-cut tree in fixed order. Its sole write authority remains one expected-preimage compare-and-swap from the isolated successor candidate ref to the declared post-cut commit and tree. Primary is never a target. Crash resolution recognizes only the exact preimage or postimage. The coordinator cannot reconstruct or substitute an Authority guard, and the cumulative proof runner remains effect-inert.

      Any source-case, sighting, classification, overlap, V4 loss, quarantine, owner-universe, Foundation closure, activation, consumer, reader, hold, rollback, namespace, Release, Store, protected-journal, Git, primary-boundary, currentness or revocation drift refuses before candidate-ref CAS. Stage 12 freezes exactly one final Stage 0 through 12 closure for one independent Python, Rust and Ruby cumulative seal, one final receipt and one derived pointer. This Decision changes no public Packet, Operation, Result, Action, ScopeAtom, Ceremony, MCP Tool, Recipe, Resource, Bundle, Release, catalog or wire member.
    superseded_by: dec-canonical-v4-loss-authority-naming-2e14
    supersedes:
    - dec-canonical-manifest-bound-one-use-legacy-d5db
    preview: complete V4 loss/root/rollback/epoch closure -> Authority LegacyRemovalGuardV3 for product-only pruning; separately packet-bound coordinator V3 -> one isolated candidate-ref CAS -> effect-inert cumulative seal
    rejected:
    - 'Let the V2 guard accept V4 digests: that creates silent typed polymorphism and replay across incompatible epochs.'
    - 'Keep the V2 coordinator and compare aggregate identities: it cannot prove the new protected-history and owner-universe joins.'
    - 'Let the final seal runner perform pruning: proof execution remains effect-inert and owns no mutation authority.'
