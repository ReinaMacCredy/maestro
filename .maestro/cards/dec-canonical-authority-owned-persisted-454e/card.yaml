description: The user explicitly approved one bounded successor design pass after the approved c95d128a packet reached a genuine frozen-contract contradiction at provisional commit 92dca6b8c6c54b435206fd734fca4dbfddfbdbaf. Decision c77d requires Authority to derive and atomically recheck a live Repository Governance Floor object, but the frozen runtime has only a generic RepositoryGovernanceHead continuity class and caller-supplied raw governance_floor values; AuthoritySchemaV1 has no persisted floor schema or transaction-lifetime resolver. A fresh read-only adversarial review confirmed that the minimum durable fix is one immutable direct Store root at appended internal schema tag 25, not a second mutable head object. This Decision materializes that already-required owner state without implementation, canonical artifact generation, sealing, public API changes, or Action/catalog count changes.
extra:
  locked_at: 2026-07-26T06:19:20.757Z
  decision: |-
    This is one additive successor Decision. It does not supersede dec-canonical-authority-owned-governance-c77d, dec-canonical-authority-materialization-df3b, dec-canonical-authority-transition-guard-618b or any unaffected predecessor law; it supplies the persisted Authority-owned fact and current-head resolver those Decisions require but do not define. It expressly amends only the prior design-head statement that this successor has no persisted schema delta. The existing 145 Actions, 145 ActionSpecs, 444 owner rows, 43 Observations, 23 Effect Origins, 11 Ceremonies, six-plus-six governed-capacity kinds, public packet and adapter schemas, Resource catalog and public API remain semantically unchanged. RepositoryGovernanceFloorSnapshotV1 is internal durable Store data, not a public or wire object and not a capability. GovernanceAttestationV1 remains process-local and non-persistent.

    Authority appends exactly one internal Repository Store schema after the frozen 24-member AuthoritySchemaV1 runtime prefix: local tag 25 RepositoryGovernanceFloorSnapshotV1 with canonical domain maestro.vnext.repository-governance-floor-snapshot.v1. Existing tags, names, SchemaIds and bytes 1 through 24 do not change. Stage 2 generates the new SchemaId, descriptor, canonical bytes, registry suffix, internal writer/read compatibility rows and every dependent manifest identity; no hand-written digest or inferred byte-stability is accepted.

    RepositoryGovernanceFloorSnapshotV1 is immutable and content-addressed. Its canonical value contains exactly: schema domain and version; Repository Store-domain identity and Authority-context identity; one positive floor revision; optional predecessor floor object identity; activation basis = repository_genesis | explicit_legacy_migration | guarded_rotation; activation Store Generation ordinal; Authority Epoch; Trust Root revision and canonical binding commitment; Authority Transition Protocol identity and version; Authority requirement grammar identity; Authority requirement evaluator identity and revision; one finite bounded strictly sorted unique set of closed requirement rows; one recomputed semantic hash over the transition protocol, minimum assurance constraints, requirement grammar/evaluator and requirement rows; and canonicalization/protocol versions. Lineage, activation/currentness and revocation fields are excluded from the semantic hash but remain exact separately bound value fields where applicable. The Snapshot contains no Principal, Binding, Session, Grant, Mandate, Receipt, Result, candidate Scheduling policy, Scheduling Safety classifier, caller-selected currentness or bearer authority.

    Each closed requirement row is exactly global Action tag, semantic owner tag, closed participant set, positive requirement version and closed requirement AST. The Snapshot contains exactly one Action-105 row with global tag 105, Planning owner tag 12 and the fixed Planning, Authority and Persistence participant set. Missing, duplicate, unknown, unsorted, defaulted, extra-semantic or wrong-owner rows refuse. Governance requirement evaluation and Scheduling policy-diff classification remain distinct namespaces: the Snapshot owns the Authority Transition Protocol and Action-105 governance requirement only. Authority separately resolves the pinned Scheduling Safety Floor and classifier, then binds the Safety Floor identity/version/hash, classifier identity/semantic hash/revision, evaluator identity/revision and evaluator/core compatibility result only in the retained current view and GovernanceAttestationV1. No Governance Snapshot field selects or substitutes the Scheduling classifier.

    The Store Object references exactly its predecessor Snapshot when one exists. Every floor-enabled active Repository Store Generation has exactly one direct RepositoryGovernanceFloorSnapshotV1 root. Revision 1 has no predecessor. Every later revision equals predecessor revision plus one, retains Repository Store-domain and Authority-context identity, advances the activation Generation ordinal, and forms one acyclic gap-free history. Rotation replaces the direct root while retaining the immutable predecessor chain. A transitively reachable but non-root Snapshot is historical only. Zero or multiple direct roots, an unknown schema/version, a broken, forked, cyclic, truncated or skipped-revision chain, or a mismatched Store domain, context, Epoch or Trust Root fails closed.

    The existing RepositoryGovernanceHead continuity class remains class tag 8 and Authority-owned; no new continuity class or census row is added. Its class-total closure becomes the exact current direct Snapshot root and immutable predecessor history rather than an empty class root or generic active-object-set digest. The Authority continuity closure, successor state and Store Head atomically commit this exact class root. No generic transition-guard owner-fact hash, BootstrapAuthoritySnapshotV1, SuccessVisibleAuthorityContinuityStateV1, AdmittedTransitionGuardV1, source_floor_root, caller digest or active-object-set hash can stand in for the Snapshot.

    Repository genesis is the sole absent-to-present branch. The already-authorized human-present repository genesis ceremony atomically creates revision 1, the exact RepositoryGovernanceHead class root, Authority continuity closure and Store Head before ordinary runtime authority exists; there is no default floor and floor-dependent mutation refuses while the direct root is absent. Later floor or Trust Root rotation uses the existing RepositoryFloorOrTrustRootRotation guard with current floor, proposed floor and current predeclared continuity/root-rotation requirement. The publication reuses existing Authority Action 68 AcceptContinuityFloor, owner family Authority tag 8 and owner-local tag 23. Weakening additionally consumes the already-required exact governance downgrade Mandate under existing laws. One Store-head CAS appends the new Snapshot, replaces the direct root, advances the class root and continuity state, consumes authority, and publishes Receipt, Result and idempotency. Scheduling Action 105 preserves the exact direct floor root and never creates, selects or rotates it. No Action, owner, participant set or catalog member is added.

    Authority freezes one owner-private transaction-lifetime RepositoryGovernanceFloorCurrentViewV1<'tx> resolver and consumer. Persistence exposes only the existing coherent generic Store transaction view. Authority alone selects the unique direct root, decodes and validates its schema, rows, lineage and semantic hash, and joins the exact Store instance and activation or restore incarnation; current Store Head and revision; Generation identity and ordinal; Authority Context; Epoch; Trust Root; continuity state token, fence and currentness; current revocation object and its owning subject revision; the Snapshot object, revision and class root; the exact Action-105 requirement; and the separately resolved Scheduling Safety Floor/classifier/evaluator/compatibility tuple. It returns only an Authority-private non-serializable borrow used to mint GovernanceAttestationV1<'tx>.

    Action-105 ordering is fixed. Authority first checks exact committed-Result idempotency replay or conflict before capability minting; resolves the current Store, Authority and direct-floor view; authenticates Principal, human Binding and Session and validates ordinary authority; validates typed Planning current-policy, candidate-policy and Scheduling Safety facts; evaluates the Snapshot's Action-105 requirement in the Governance namespace; independently selects and runs the pinned Scheduling Safety classifier; mints the existing GovernanceAttestationV1, df3b Action binding and optional downgrade Mandate use; builds the exact successor Generation preserving the same direct floor root; and immediately at the Store-head CAS atomically re-resolves and equality-checks every bound Store, Head, Generation, floor, class-root, requirement, classifier/evaluator, Safety Floor, Authority, revocation, time, expected-old, idempotency, debit, carrier and Mandate fact before consuming all required capabilities and publishing Binding, Receipt, Result, successor Authority/capacity state and idempotency in one commit.

    The internal scheduling facade accepts typed Planning input only. It has no governance floor tuple, id, revision, hash, requirement, classifier selector/result, downgrade boolean, parsed Authority state or raw Authority numeric input. SchedulingPolicyMeaningV1 no longer represents governance as another numeric Scheduling floor. Planning, Stage 7, adapters, Orchestration, registries, callbacks and callers cannot implement or supply the current-head resolver. Stage 7 supplies only nominal typed policy and Safety facts plus the already-authenticated invocation context accepted by the frozen Authority facade and never edits Authority files after Stage 5 freezes.

    Repository genesis publishes revision 1. An existing legacy or pre-successor Store with no native direct root requires one explicit authorized migration transaction using the existing governance/continuity authority and exact migration association; until that transaction commits, floor-dependent mutations including Action 105 refuse while read, export and recovery remain available. Migration never translates or defaults caller numeric floors, candidate policy, generic continuity hashes, filenames, labels, copied bytes or temporal ordering. Same-domain restore may activate the exact direct root and full predecessor chain only after complete Store Generation continuity, old-writer fencing, Authority Epoch, Trust Root, currentness, anti-rollback and writer/schema compatibility proof. Missing, forked, truncated, unknown-version or stale restored floors enter migration- or recovery-required state, never a default floor. Copied same-Domain bytes without writer succession are inert; different-Domain import is non-bearing.

    Same-key exact-same committed Result replay returns before current-view or attestation acquisition and performs no new authority spend or writes. Changed meaning conflicts. Crash before the one CAS leaves no new Snapshot, class root, Receipt, Result or spend visible and every process-local capability dies. Crash after CAS replays the stored Result and never reconstructs a capability. Post-write acknowledgement loss is resolved from the exact direct root, class root, Receipt, Result and idempotency rows, never by blind retry or ordinary refusal. Historical Snapshot objects and Results remain evidence only and cannot authorize a new effect.

    Stage 5 owns the internal schema, exact class closure, current-head resolver, frozen Authority facade operation and test-only conformance adapters. The approved fanout denylist remains closed over src/domain/vnext/authority/. Preserved Stage 6 through 12 candidate commits remain noncurrent evidence and are not integrated by this design pass. The blocked eight-file correction remains preserved at 92dca6b8c6c54b435206fd734fca4dbfddfbdbaf and may resume only after the replacement packet is approved.

    Proof must generate and independently validate the exact internal descriptor and canonical encoding; the append-only 1-through-24 schema-prefix law; internal writer/read compatibility rotation with old-generation decoding; class-specific RepositoryGovernanceHead closure; genesis, migration and rotation totality; exact Action-68 and Action-105 separation; full current-view and final-reread equality; Result-before-capability replay ordering; and zero-write/zero-spend refusal. Mutants cover missing, duplicate, non-root, wrong-schema, wrong-semantic-hash, stale and rollback floors; broken, forked, cyclic, truncated and skipped lineage; wrong Store/context/incarnation/Head/Generation/Epoch/Trust Root/state token/fence/time/revocation; missing, duplicate, unsorted, unknown or wrong-owner Action-105 row; wrong grammar/evaluator/protocol; caller-supplied floor, classifier or currentness; Governance/Safety/Transition classifier substitution; changed Authority state after mint; rotation without current/proposed/continuity guard; weakening without Mandate; automatic legacy default; restore rollback/fork/truncation; capability mint before idempotency replay; cross-request or cross-transaction substitution; capability escape, clone, serialization, caching, Send/Sync, replay and double consumption; split commit; crash before and after every CAS boundary; acknowledgement loss; old-writer floor loss; and any public API, Action or catalog-count drift. Every affected Stage-2, Stage-4, Stage-5, candidate-root, proof-input, writer-compatibility and enclosing identity is regenerated only after replacement packet approval; historical receipts remain immutable noncurrent evidence. No canonical artifact or seal is created during this design pass.
  preview: |-
    Repository genesis, explicit migration, or guarded Action 68
      -> immutable direct RepositoryGovernanceFloorSnapshotV1 root (internal tag 25)
      -> exact RepositoryGovernanceHead class closure + predecessor history

    Action 105 typed Planning + Safety facts
      -> Authority resolves retained direct-root Store view
      -> Governance requirement evaluation
      -> separate Scheduling Safety classifier evaluation
      -> one-use GovernanceAttestationV1<'tx> + df3b carriers
      -> same-CAS full reread and committed Result or zero-write refusal
  rejected:
  - 'Add a second mutable RepositoryGovernanceFloorHeadV1 object or head table: the active Generation''s unique direct Snapshot root already provides exact selection, while a second pointer adds split-brain and cross-CAS states.'
  - 'Reuse the generic RepositoryGovernanceHead name, active-object-set hash, AdmittedTransitionGuardV1, source_floor_root or SuccessVisibleAuthorityContinuityStateV1 without a typed Snapshot: none carries the required governance semantics, Action-105 row or exact current selection.'
  - 'Reuse BootstrapAuthoritySnapshotV1 or add fields to an existing schema: bootstrap and ordinary current-governance meanings would be conflated and frozen SchemaIds or old bytes would silently change.'
  - 'Persist the Scheduling Safety classifier inside the Governance Snapshot: that conflates the Governance requirement namespace with Planning-owned Scheduling Safety semantics; Authority must resolve and join them separately.'
  - 'Let Planning, Stage 7 or an adapter supply a raw floor tuple, digest, id, requirement, classifier result, currentness or parsed Authority snapshot: this transfers Authority ownership and permits stale or substituted governance.'
  - 'Use a hidden global Store lookup, registry, cache, callback or static provider: acquisition would escape the authenticated transaction and could replay across repositories, Generations, Epochs or Trust Roots.'
  - 'Add a public schema, public API, Action, owner, catalog row or new rotation command: one internal schema plus existing Action 68 and Action 105 provide the required ownership and lifecycle.'
  - 'Infer or promote a floor from legacy numeric values, candidate policy, filenames, transition labels, copied bytes or temporal order: migration evidence is non-bearing unless a complete native chain or fresh authorized migration/publication exists.'
