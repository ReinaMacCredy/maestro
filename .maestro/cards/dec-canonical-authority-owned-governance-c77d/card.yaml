updated_at: 2026-07-26T03:39:31.959Z
extra:
  locked_at: 2026-07-26T03:39:31.959Z
  decision: |-
    Authority owns one new sealed internal GovernanceAttestationV1<'tx> and its complete validation law. It joins, and does not replace, the unaffected VerifiedSchedulingPolicyDowngradeMandateUseV1 and AdmittedRepositoryActionBindingV1<'tx,K> carriers locked by dec-canonical-authority-materialization-df3b. Authority may mint it only inside the canonical Repository Store transaction from one retained live Authority view after authenticating the exact Principal, human Binding and Session and resolving the exact repository and domain, Store instance and activation incarnation, Generation id and ordinal, current Head and revision, Authority Context, Trust Root, Epoch, state token, fence, trusted time and unpredictable transaction-local occurrence. The attestation binds the expected-old Scheduling Binding identity, hash and revision; the candidate Binding object, schema and hash; Action 105, owner tag 12, participants, request, payload and idempotency meaning; the live Repository Governance Floor object identity, schema, version, revision and semantic hash; the Action-105 requirement snapshot and requirement grammar/evaluator identity; currentness anchors and revocation-set revision; and every applicable ordinary Authority witness, complete DebitMapV1 and root-use atom.

    Planning remains the semantic owner of SchedulingAssessmentV1 and Action 105 PublishSchedulingPolicyBinding. Planning may provide only nominal typed current-policy, candidate-policy and safety facts that Authority independently recomputes or validates against the retained current view. Planning, Orchestration, adapters and callers may not provide, parse, reconstruct, select or attest a Governance Floor id, revision, requirement, classifier choice or result, downgrade route or boolean, currentness token, revocation fact, raw numeric floor, digest standing in for a floor, or serialized Authority state. A persisted Planning diff is an input to equality checking, never live Authority proof.

    Authority independently validates two noninterchangeable namespaces. Repository Governance Floor owns the Action-105 Authority requirement. Scheduling Safety Floor owns the pinned Scheduling policy-diff classifier. Authority binds the exact current and candidate Scheduling Policy identities and canonical semantics, evaluator identity and revision, complete diff, Scheduling classifier identity, hash, revision and result, Safety Floor identity, version and hash, and evaluator/core compatibility result. It must not reuse the Authority Transition Protocol classifier or a persisted Satisfied transition guard for this purpose. Equivalent and strengthening publication uses the already locked no-downgrade path. Weakening or incomparable publication additionally requires and atomically consumes the exact existing one-use downgrade Mandate.

    Immediately at the one Store-head CAS linearization point, Authority atomically rechecks every bound floor, requirement, classifier, policy, safety, Authority, revocation, time, expected-old, idempotency, debit, carrier and optional Mandate fact against one coherent live view. Success consumes the attestation once and atomically joins the existing action binding, optional Mandate use, exact planned Receipt, Result, successor capacity, output and write set, Authority consumption and idempotency mapping. Any mismatch yields zero writes and zero spend. Minting or drop grants nothing; failure to consume aborts. A same-key, exact-same durable semantic request returns only the already committed Result before capability minting and without new spend; changed meaning conflicts. Crash before finality destroys the attestation and requires fresh derivation; crash after finality replays only the stored Result. Later revocation does not erase a historical Result, but that Result cannot authorize or repeat an effect.

    GovernanceAttestationV1 is process-local, Authority-minted, move-only, non-cloneable, non-serializable, non-cacheable, non-replayable and non-transferable. Capability replay is forbidden; exact committed-Result idempotency replay remains required. It has private fields, a private constructor and a non-static transaction lifetime; no public or crate-wide constructor, Copy, Clone, Default, Debug, Send, Sync, 'static escape, accessor, digest-only projection, runtime-tag downcast or conversion, canonical bytes, persistence, registry, cache, log form, Resource identity, wire representation, restart reconstruction or hidden Store lookup exists. A durable Receipt or Result may retain only non-bearing fact commitments, never a reconstructable bearer form. Stage 5 freezes the sealed Authority owner port and a test-only conformance adapter; Stage 7 replaces the caller-supplied governance tuple with production typed Planning inputs and Authority-owned derivation. Proof must reject every raw-floor, parsed-state, stale-view, wrong-classifier, wrong-revision, replay, double-consumption, split-transaction and post-revocation mutant while preserving the exact 145-Action and 444-row catalogs.
  preview: |-
    Planning typed policy + safety facts
      -> retained canonical Repository Store transaction
      -> Authority derives live Governance Floor + classifier + currentness
      -> sealed one-use GovernanceAttestationV1<'tx>
      -> exact Action-105 publication commit or zero-write refusal
  rejected:
  - 'Keep governance_floor as a caller-supplied numeric tuple or digest and ask Authority only to recommit it: this permits a weaker substituted floor under otherwise valid authority.'
  - 'Let Planning parse or cache the active Authority snapshot, classifier result or Governance Floor: this transfers Authority ownership and creates stale replay evidence.'
  - 'Persist, serialize, clone or expose the attestation or any digest-only bearer projection: a transaction-local validation could escape and authorize later publication.'
  - 'Split attestation validation, downgrade Mandate consumption and SchedulingPolicyBinding publication across calls or commits: crash and race cuts could publish without the live floor or spend without publication.'
